name = "barpi-auth"
main = "src/index.js"
compatibility_date = "2024-12-01"

# === Bindings ===
[[kv_namespaces]]
binding = "OTP_KV"
id = "5d2685f414a14ff4ac050eea5b19bdcf"  # barpi-bible-acl

[[d1_databases]]
binding = "DB"
database_name = "barpi-bible"
database_id = "45c93052-c82c-4d0c-901b-2999187643b9"

# === Env vars (set via wrangler secret put ...) ===
# JWT_SECRET — secret (set: npx wrangler secret put JWT_SECRET)
# RESEND_API_KEY — secret
[vars]
ADMIN_EMAILS = "vg@abrisart.com,fg@abrisart.com"
SENDER_EMAIL = "noreply@barpi.ua"
ALLOWED_ORIGIN = "https://brand.barpi.ua"
PUBLIC_BASE_URL = "https://brand.barpi.ua/"

