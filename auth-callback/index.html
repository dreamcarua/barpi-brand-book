<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Sign-in callback · Barpi</title>
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#0a0a0a;color:#fff;font-family:Rubik,-apple-system,BlinkMacSystemFont,sans-serif}
  .wrap{height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:#181818;border:1px solid #2a2a2a;border-radius:16px;padding:34px;max-width:420px;width:100%;text-align:center}
  .logo{width:64px;height:64px;background:#FEBF27;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:16px;color:#0a0a0a}
  h1{font-size:20px;margin:0 0 8px}
  p{color:rgba(255,255,255,.6);font-size:13px;line-height:1.6;margin:0 0 14px}
  .spin{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.2);border-top-color:#FEBF27;border-radius:50%;animation:s .8s linear infinite;vertical-align:middle;margin-right:6px}
  @keyframes s{to{transform:rotate(360deg)}}
  a.btn{display:inline-block;background:#FEBF27;color:#0a0a0a;text-decoration:none;padding:10px 18px;border-radius:8px;font-weight:700;font-size:13px;margin-top:8px}
  .err{color:#ff7373;background:rgba(255,80,80,.08);padding:10px;border-radius:8px;font-size:12px;margin-top:10px;font-family:monospace}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="logo">🔐</div>
    <h1 id="t">Sign in…</h1>
    <p id="m"><span class="spin"></span>Перевіряю токени</p>
    <div id="err" class="err" style="display:none"></div>
    <div id="actions" style="display:none">
      <a class="btn" href="/dashboard/">Open dashboards →</a>
      <a class="btn" href="/" style="background:#2a2a2a;color:#fff;margin-left:8px">Brand Bible →</a>
    </div>
  </div>
</div>
<script>
(async function(){
  const SUPABASE_URL = 'https://zrcqmwlpsggiqgipvxhv.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpyY3Ftd2xwc2dnaXFnaXB2eGh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MzcyMTYsImV4cCI6MjA5NTUxMzIxNn0.ROzbQ6aGRs-9rDVIDv0UyzlrvBRWFmFMQ7n77bLALmY';
  const ALLOWED = [
    'vg@abrisart.com',
    'office@barpi.com.ua',
    'aksonov@barpi.com.ua',
    'pylyp@abrisart.com',
    'office@abrisart.com',
    'vg@dreamcar.ua',
  ];
  const t = document.getElementById('t');
  const m = document.getElementById('m');
  const errBox = document.getElementById('err');
  const actions = document.getElementById('actions');

  function fail(code, detail){
    t.textContent = 'Sign-in failed';
    m.innerHTML = 'Не вдалось увійти. ' + (code || '');
    errBox.style.display = 'block';
    errBox.textContent = detail || code || 'unknown error';
    actions.innerHTML = '<a class="btn" href="/dashboard/">← Повернутись</a>';
    actions.style.display = 'block';
  }

  const hash = location.hash.replace(/^#/, '');
  const search = location.search.replace(/^\?/, '');
  const params = new URLSearchParams(hash || search);

  if (params.get('error')) {
    return fail(params.get('error'), params.get('error_description') || '');
  }

  const access_token = params.get('access_token');
  const refresh_token = params.get('refresh_token');
  const expires_in = parseInt(params.get('expires_in') || '3600', 10);

  if (!access_token) {
    return fail('NO_TOKEN', 'У URL немає access_token. Можливо, посилання застаріле або вже використане.');
  }

  let userEmail = null;
  try {
    const r = await fetch(SUPABASE_URL + '/auth/v1/user', {
      headers: {
        'apikey': SUPABASE_ANON,
        'Authorization': 'Bearer ' + access_token,
      },
    });
    if (!r.ok) {
      return fail('USER_FETCH_' + r.status, await r.text());
    }
    const u = await r.json();
    userEmail = (u.email || '').toLowerCase();
  } catch (e) {
    return fail('NETWORK', e.message);
  }

  if (!userEmail) {
    return fail('NO_EMAIL', 'Не вдалось отримати email користувача');
  }

  if (!ALLOWED.includes(userEmail)) {
    return fail('NOT_ALLOWED', 'Email ' + userEmail + ' не у списку доступу');
  }

  const session = {
    access_token,
    refresh_token,
    email: userEmail,
    expires_in,
    issued_at: Date.now(),
  };
  localStorage.setItem('bb_auth_session', JSON.stringify(session));

  const returnTo = localStorage.getItem('bb_auth_returnTo') || '/dashboard/';
  localStorage.removeItem('bb_auth_returnTo');

  t.textContent = '✓ Signed in';
  m.innerHTML = 'Вітаємо, <strong>' + userEmail + '</strong>!<br>Переадресовую…';
  setTimeout(() => { location.href = returnTo; }, 800);
})();
</script>
</body>
</html>
