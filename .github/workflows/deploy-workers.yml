name: Deploy Workers
# NOTE (19.08.2026): push-trigger вимкнено — repo secrets CF_API_TOKEN /
# CF_ACCOUNT_ID не налаштовані, тому кожен push у workers/** давав червоний
# run. Робочий шлях деплою — wrangler на Mac (див. RUNBOOK). Щоб повернути
# авто-деплой: створити CF API token (Workers Scripts:Edit + D1:Edit),
# `gh secret set CF_API_TOKEN` + `gh secret set CF_ACCOUNT_ID`, і повернути
# блок push: branches [main], paths ['cf-migration/workers/**'].
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Deploy barpi-api
        working-directory: cf-migration/workers/barpi-api
        run: npx --yes wrangler@3 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
