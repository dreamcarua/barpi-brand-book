name = "barpi-hr"
main = "src/index.js"
compatibility_date = "2024-09-23"
account_id = "ab63a85bdfbf5894c28efe7076acbd82"
workers_dev = false

# Найм і кар'єра Barpi (рішення Вадима 17.10.2026). Код: src/hr.js, src/careers.js — копія Abris Art.
#   /dashboard/api/hr/*       за Cloudflare Access (та сама політика, що й /dashboard/*); JWT перевіряється в коді
#   /hr-api/public/careers*   публічний API для barpi.com.ua/kariera/ (CORS лише barpi.com.ua)
routes = [
  { pattern = "brand.barpi.ua/dashboard/api/hr/*", zone_name = "barpi.ua" },
  { pattern = "brand.barpi.ua/hr-api/*", zone_name = "barpi.ua" },
]

[[d1_databases]]
binding = "DB"
database_name = "barpi-bible"
database_id = "45c93052-c82c-4d0c-901b-2999187643b9"

# Резюме кандидатів: окремий бакет, бо це персональні дані (не змішувати з barpi-kb-files)
[[r2_buckets]]
binding = "FILES_BUCKET"
bucket_name = "barpi-hr-files"

# Ліміти частоти (відгуки з IP, записи в дашборді)
[[kv_namespaces]]
binding = "OTP_KV"
id = "5d2685f414a14ff4ac050eea5b19bdcf"

# Лист про новий відгук: Cloudflare Email Routing, отримувач — підтверджена адреса Email Routing
[[send_email]]
name = "HR_MAIL"

[vars]
ACCESS_TEAM_DOMAIN = "https://uabarpi.cloudflareaccess.com"
HR_MAIL_FROM = "careers@barpi.com.ua"
HR_NOTIFY_EMAIL = "office@barpi.ua"
# Секрети (wrangler secret put, значень у репо немає — репо публічне):
#   TG_TOKEN            бот @barpiua_bot
#   HR_TG_CHATS         chat_id через кому: Вадим, Олександр (після Start у боті)
#   HR_ADMIN_EMAILS     адміни HR (бачать і правлять зарплати)
#   HR_PAYROLL_EMAILS   додатково, хто бачить зарплати
#   HR_EMAILS           хто має доступ до HR; не задано = усі з allowlist Cloudflare Access
