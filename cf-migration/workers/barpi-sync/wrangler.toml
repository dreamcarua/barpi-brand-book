name = "barpi-sync"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Hourly cron trigger
[triggers]
crons = ["0 * * * *"]

# D1 binding — barpi-bible
[[d1_databases]]
binding = "DB"
database_name = "barpi-bible"
database_id = "45c93052-c82c-4d0c-901b-2999187643b9"

# Secrets (set via `wrangler secret put MOYSKLAD_TOKEN`):
# - MOYSKLAD_TOKEN
# - SYNC_API_KEY (optional shared key for manual trigger via HTTP)

[vars]
MS_BASE_URL = "https://api.moysklad.ru/api/remap/1.2"
ENVIRONMENT = "production"
