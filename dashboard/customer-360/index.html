<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer 360 · Barpi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/bb.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--y:#001154;--y-soft:rgba(0,17,84,.13);--y-light:#BAD9F4;--g:#39B44A;--g-soft:rgba(57,180,74,.13);--r:#E84040;--r-soft:rgba(232,64,64,.10);--bl:#3B82F6;--bl-soft:rgba(59,130,246,.10);--or:#F59E0B;--or-soft:rgba(245,158,11,.13);--d:#1A1A1A;--bg:#FAF7F7;--card:#fff;--muted:#888;--border:#E5E5DC;--line:#EEE;--vi:#8B5CF6;--vi-soft:rgba(139,92,246,.13)}
body{background:var(--bg);font-family:Rubik,-apple-system,sans-serif;color:var(--d);margin:0}
.cp-topbar{position:sticky;top:0;z-index:200;background:var(--d);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px;border-bottom:3px solid var(--y)}
.cp-topbar h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
.cp-topbar .sub{font-size:11px;opacity:.6;font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.cp-topbar .spacer{flex:1}
.cp-topbar .sync{font-size:12px;opacity:.7;display:flex;align-items:center;gap:6px}
.cp-topbar .dot{width:8px;height:8px;border-radius:50%;background:var(--g)}
.cp-selector{position:sticky;top:48px;z-index:150;background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;display:flex;gap:10px;align-items:center;justify-content:center}
.cp-selector .search{flex:1;max-width:520px;position:relative}
.cp-selector input{width:100%;font-family:Rubik;font-size:14px;padding:10px 14px 10px 38px;border:1px solid var(--border);border-radius:99px;background:#fff;color:var(--d);outline:none}
.cp-selector input:focus{border-color:var(--y);box-shadow:0 0 0 3px var(--y-soft)}
.cp-selector .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--muted)}
.cp-selector .back{font-family:Rubik;font-size:13px;font-weight:600;padding:8px 16px;border-radius:99px;border:none;background:var(--y);color:#fff;cursor:pointer}
.autocomplete{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:8px;margin-top:4px;max-height:340px;overflow:auto;box-shadow:0 8px 24px rgba(0,17,84,.08);z-index:100;display:none}
.autocomplete.show{display:block}
.ac-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13px;display:flex;align-items:center;gap:8px}
.ac-item:hover{background:var(--y-soft)}
.ac-item .name{flex:1;font-weight:600}
.ac-item .ch{font-size:10px;padding:2px 6px;border-radius:99px;background:var(--y-soft);color:var(--y)}
.cp-wrap{max-width:1440px;margin:0 auto;padding:20px 24px 40px}
.sec{margin:24px 0 12px;display:flex;align-items:center;gap:10px}
.sec h2{margin:0;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sec .badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--y-soft);color:var(--y)}
.g1{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:900px){.g2,.g3,.g4,.g5{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;transition:all .2s}
.kpi:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,17,84,.06)}
.kpi .lbl{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.kpi .val{font-size:22px;font-weight:800;color:var(--d);letter-spacing:-.02em;line-height:1.1}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:6px}
.kpi.cy{border-bottom:3px solid var(--y)}.kpi.cg{border-bottom:3px solid var(--g)}.kpi.cr{border-bottom:3px solid var(--r)}.kpi.cb{border-bottom:3px solid var(--bl)}.kpi.co{border-bottom:3px solid var(--or)}.kpi.cv{border-bottom:3px solid var(--vi)}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:11px;padding:2px 7px;border-radius:99px}
.delta.up{background:var(--g-soft);color:var(--g)}.delta.dn{background:var(--r-soft);color:var(--r)}.delta.neu{background:#f3f3f3;color:#777}
.cc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.cc-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cc-head h3{margin:0;font-size:14px;font-weight:700;color:var(--d)}
.cc-head .pill{font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--y-soft);color:var(--y);text-transform:uppercase}
.rfm-grid{display:grid;grid-template-columns:120px repeat(3,1fr);gap:6px;font-size:12px}
.rfm-cell{padding:14px 12px;text-align:center;border-radius:8px;color:#fff;font-weight:700;cursor:pointer;transition:all .15s}
.rfm-cell:hover{transform:scale(1.02);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.rfm-cell .cnt{font-size:22px;line-height:1}
.rfm-cell .lbl{font-size:10px;opacity:.9;margin-top:4px}
.rfm-row-lbl{display:flex;align-items:center;justify-content:flex-end;padding-right:10px;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase}
.rfm-col-lbl{text-align:center;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;padding-bottom:4px}
.mover-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.mover-card h4{margin:0 0 10px;font-size:13px;font-weight:700;color:var(--d)}
.mover-row{display:grid;grid-template-columns:24px 1fr 90px 70px;gap:8px;font-size:12px;padding:6px 4px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.mover-row:hover{background:var(--y-soft);border-radius:4px}
.mover-row .rk{color:var(--muted);font-weight:700;font-size:11px}
.mover-row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mover-row .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--y);font-weight:700}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt th{text-align:left;padding:8px 12px;font-weight:700;font-size:10px;text-transform:uppercase;color:var(--muted);background:#FAFAF5;border-bottom:1px solid var(--line);letter-spacing:.05em}
table.dt td{padding:9px 12px;border-bottom:1px solid #F4F4F0;color:var(--d)}
table.dt tbody tr{cursor:pointer}
table.dt tbody tr:hover{background:#FBFAF5}
table.dt td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.tbl-scroll{max-height:400px;overflow:auto;border-radius:8px;border:1px solid var(--line)}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.04em}
.tag.ty{background:var(--y-soft);color:var(--y)}.tag.tg{background:var(--g-soft);color:var(--g)}.tag.tr{background:var(--r-soft);color:var(--r)}.tag.tor{background:var(--or-soft);color:var(--or)}.tag.tv{background:var(--vi-soft);color:var(--vi)}
.cust-header{background:linear-gradient(135deg,var(--d) 0%,#2A2A2A 100%);color:#fff;padding:28px 32px;border-radius:16px;margin-bottom:20px;position:relative;overflow:hidden}
.cust-header::before{content:"";position:absolute;top:-50%;right:-10%;width:400px;height:400px;background:radial-gradient(circle,rgba(186,217,244,.15),transparent 70%);pointer-events:none}
.cust-header .cust-name{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0 0 8px;position:relative}
.cust-meta{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;opacity:.85;position:relative}
.cust-tags{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap;position:relative}
.cust-tag{font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;background:rgba(186,217,244,.2);border:1px solid rgba(186,217,244,.3);color:#fff}
.cust-tag.seg{background:var(--y-light);color:var(--y)}
.health-hero{display:flex;align-items:center;gap:24px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:16px}
.health-circle{width:120px;height:120px;flex-shrink:0;position:relative}
.health-circle svg{transform:rotate(-90deg)}
.health-circle .val{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:32px;font-weight:800;color:var(--d);letter-spacing:-.02em}
.health-circle .lbl{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.health-info{flex:1}
.health-info h3{margin:0 0 8px;font-size:18px;font-weight:700;color:var(--d)}
.health-info .components{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.health-comp{padding:6px 12px;background:#FAFAF5;border-radius:8px;font-size:12px;color:var(--muted)}
.health-comp strong{color:var(--d);font-weight:700}
.timeline{max-height:480px;overflow:auto;border-radius:8px;border:1px solid var(--line)}
.tl-item{display:grid;grid-template-columns:80px 1fr 120px;gap:14px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center;font-size:13px}
.tl-item:hover{background:#FBFAF5}
.tl-item .date{font-size:11px;font-weight:600;color:var(--muted)}
.tl-item .desc{font-weight:500;color:var(--d)}
.tl-item .qty{font-size:11px;color:var(--muted);margin-top:2px}
.tl-item .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--y);font-weight:700}
.insight{padding:14px;background:#fff;border:1px solid var(--line);border-radius:10px;border-left:4px solid var(--y)}
.insight.green{border-left-color:var(--g);background:#F6FDF7}
.insight.red{border-left-color:var(--r);background:#FEF6F6}
.insight.yellow{border-left-color:var(--or);background:#FFFBEE}
.insight h4{margin:0 0 6px;font-size:13px;font-weight:700;color:var(--d);display:flex;align-items:center;gap:6px}
.insight p{margin:0;font-size:12px;color:#555;line-height:1.5}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:13px}
.placeholder{padding:20px;background:#FBFAF5;border:1px dashed var(--border);border-radius:10px;color:var(--muted);font-size:13px;text-align:center}
.toast{position:fixed;bottom:24px;right:24px;background:var(--d);color:#fff;padding:14px 22px;border-radius:10px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;transform:translateY(8px);transition:all .25s;z-index:1000}
.toast.show{opacity:1;transform:translateY(0)}
.toast.err{background:var(--r)}
.chart-wrap{position:relative;height:280px}
.chart-wrap.tall{height:340px}
.chart-wrap.xl{height:380px}
.dow-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow-cell{padding:14px 6px;text-align:center;border-radius:6px;color:#fff;font-weight:700;font-size:12px}
.dow-cell.empty{background:#F4F4F0;color:#bbb}
.dow-cell .dow-name{font-size:9px;opacity:.85;text-transform:uppercase;margin-bottom:4px}
.dow-cell .dow-cnt{font-size:14px;line-height:1}
.crm-row{display:grid;grid-template-columns:90px 110px 1fr 140px 30px;gap:10px;padding:10px 0;border-bottom:1px dashed var(--border);align-items:start;font-size:13px}
.crm-row:last-child{border:none}
.crm-row .crm-date{font-weight:700;color:var(--d);font-size:12px}
.crm-row .crm-type{font-size:11px;font-weight:600;color:#555;padding:2px 8px;border-radius:8px;background:#F1F1EB;white-space:nowrap;text-align:center}
.crm-row .crm-text{color:#333;line-height:1.5}
.crm-row .crm-text strong{display:block;color:var(--d);margin-top:4px;font-size:11.5px}
.crm-row .crm-next{font-size:11px;color:var(--muted);text-align:right}
.crm-row .crm-next.due{color:var(--r);font-weight:700}
.crm-del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;opacity:.4}
.crm-row:hover .crm-del{opacity:1}
.crm-add{background:var(--y);color:#fff;border:0;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.crm-add:hover{background:#0a1f7a}
.crm-modal{position:fixed;inset:0;background:rgba(30,30,30,.7);z-index:9990;display:none;align-items:center;justify-content:center;padding:20px}
.crm-modal.open{display:flex}
.crm-modal-card{background:#fff;border-radius:14px;padding:24px 26px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.crm-modal-title{font-size:16px;font-weight:800;color:var(--d);margin-bottom:14px}
.crm-modal label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:10px 0 4px}
.crm-modal input,.crm-modal textarea,.crm-modal select{width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;outline:none;box-sizing:border-box}
.crm-modal input:focus,.crm-modal textarea:focus,.crm-modal select:focus{border-color:var(--y)}
.crm-modal textarea{min-height:70px;resize:vertical}
.crm-modal-actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.crm-modal-btn{padding:9px 18px;border-radius:8px;border:0;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;text-transform:uppercase;letter-spacing:.3px}
.crm-modal-btn.cancel{background:#F1F1EB;color:#666}
.crm-modal-btn.save{background:var(--y);color:#fff}
.cs-row{display:grid;grid-template-columns:24px 1fr 100px 80px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
.cs-row:last-child{border:none}
.cs-row .rk{color:var(--muted);font-weight:700;font-size:11px}
.cs-row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs-row .val{text-align:right;font-weight:700;color:var(--y)}
.cs-row .cat{font-size:10px;padding:2px 6px;border-radius:99px;background:var(--y-soft);color:var(--y)}
.period-chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{font-family:Rubik;font-size:12px;font-weight:600;padding:7px 16px;border-radius:99px;border:1px solid var(--border);background:#fff;color:var(--d);cursor:pointer;transition:all .15s}
.chip:hover:not(.active){background:var(--y-soft);border-color:var(--y)}
.chip.active{background:var(--y);color:#fff;border-color:var(--y);box-shadow:0 2px 8px rgba(0,17,84,.2)}
.period-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:6px}
.prod-row{display:grid;grid-template-columns:30px 1fr 90px 70px 90px 70px;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);font-size:12.5px;cursor:default}
.prod-row:hover{background:#FBFAF5}
.prod-row .rk{color:var(--muted);font-weight:700;font-size:11px;text-align:center}
.prod-row .nm{font-weight:600;color:var(--d);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prod-row .cat{font-size:10px;padding:2px 8px;border-radius:99px;background:var(--y-soft);color:var(--y);text-align:center;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.prod-row .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.prod-row .num.rev{color:var(--y);font-weight:800}
.prod-row .num.cust{color:var(--g);font-weight:700}
.prod-bar{position:relative;height:4px;background:var(--y-soft);border-radius:99px;margin-top:4px;overflow:hidden}
.prod-bar-fill{position:absolute;top:0;left:0;height:100%;background:var(--y);border-radius:99px;transition:width .25s}
.hmap{display:grid;grid-template-columns:160px repeat(3,1fr);gap:4px;font-size:11px}
.hmap-cell{padding:14px 8px;text-align:center;border-radius:6px;font-weight:700;cursor:pointer;transition:all .15s}
.hmap-cell:hover{transform:scale(1.03);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.hmap-cell .cnt{font-size:18px;line-height:1;display:block}
.hmap-cell .pct{font-size:9px;opacity:.85;margin-top:3px;display:block}
.hmap-lbl{display:flex;align-items:center;justify-content:flex-end;padding-right:10px;font-weight:700;color:var(--muted);font-size:11px;text-transform:uppercase}
.hmap-col-lbl{text-align:center;font-weight:700;color:var(--muted);font-size:10px;text-transform:uppercase;padding-bottom:6px}
.ar-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ar-cell{padding:18px 14px;border-radius:10px;text-align:center;color:#fff;font-weight:700;cursor:pointer;transition:all .15s}
.ar-cell:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.12)}
.ar-cell .ar-name{font-size:11px;opacity:.9;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.ar-cell .ar-sum{font-size:18px;font-weight:800;line-height:1}
.ar-cell .ar-cnt{font-size:10px;opacity:.85;margin-top:4px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{font-family:Rubik;font-size:12px;font-weight:700;padding:10px 18px;border:0;background:none;color:var(--muted);cursor:pointer;text-transform:uppercase;letter-spacing:.04em;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--d)}
.tab.active{color:var(--y);border-bottom-color:var(--y)}
.lc-card{padding:18px;border-radius:12px;border:1px solid var(--line);text-align:center;cursor:pointer;transition:all .15s}
.lc-card:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.08)}
.lc-card .lc-cnt{font-size:32px;font-weight:800;line-height:1}
.lc-card .lc-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
.lc-card .lc-sum{font-size:11px;color:var(--y);font-weight:700;margin-top:4px}
.lc-card.c1{border-top:3px solid var(--g)} .lc-card.c2{border-top:3px solid var(--or)} .lc-card.c3{border-top:3px solid #E07F00} .lc-card.c4{border-top:3px solid var(--r)}
.cp-card{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#FBFAF5}
.cp-card .cp-name{font-weight:700;color:var(--d);font-size:13px;margin-bottom:3px}
.cp-card .cp-pos{font-size:11px;color:var(--muted);margin-bottom:6px}
.cp-card .cp-contact{font-size:11px;color:#444;display:flex;align-items:center;gap:5px;margin-top:3px}
.addr{padding:12px 14px;background:#FBFAF5;border:1px solid var(--line);border-radius:10px;font-size:12.5px;line-height:1.6}
.addr-lbl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.ar-row{display:grid;grid-template-columns:120px 1fr 90px 100px 80px 70px;gap:10px;font-size:12px;padding:8px 4px;border-bottom:1px solid var(--line);align-items:center}
.ar-row .dt{font-weight:600;font-size:11px;color:var(--muted)}
.ar-row .nm{font-weight:600}
.ar-row .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.ar-row .num.unpaid{color:var(--r)}
.ar-row .num.paid{color:var(--g)}
.ar-row .ag{text-align:center;font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px}
.ar-row .ag.current{background:var(--g-soft);color:var(--g)}
.ar-row .ag.b1{background:var(--or-soft);color:var(--or)}
.ar-row .ag.b2{background:rgba(224,127,0,.13);color:#E07F00}
.ar-row .ag.b3{background:rgba(232,64,64,.13);color:var(--r)}
.ar-row .ag.b4{background:#3A0000;color:#fff}
@media print{.cp-topbar,.cp-selector,.toast,.crm-modal{display:none}.cp-wrap{max-width:none;padding:0}body{background:#fff}.cc{box-shadow:none;page-break-inside:avoid}}
</style>
</head>
<body>
<div id="bb-shell"></div>
<main class="bb-main" id="bb-main" style="padding:0">

    <div class="g2" style="margin-top:14px"><div class="cc"><div class="cc-head"><h3>🛒 ТОП SKU клієнта</h3><span class="pill">${skus.length}</span></div><div class="tbl-scroll"><table class="dt"><thead><tr><th>#</th><th>SKU</th><th>Кат</th><th class="num">Шт</th><th class="num">Виручка</th><th class="num">Разів</th></tr></thead><tbody>${skus.slice(0,30).map((s,i)=>`<tr><td>${i+1}</td><td title="${escapeHtml(s.sku_name)}">${truncate(s.sku_name,28)}</td><td><small>${s.sku_category||'—'}</small></td><td class="num">${s.qty}</td><td class="num">${fmt.uah(s.revenue)}</td><td class="num">${s.times_ordered}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Немає</td></tr>'}</tbody></table></div></div><div class="cc"><div class="cc-head"><h3>📊 Peer-клієнт каналу</h3><span class="pill">${c.channel_name||'—'}</span></div><div class="g1" style="gap:10px"><div class="kpi"><div class="lbl">💰 Lifetime vs peer</div><div class="val">${avgLifetime?(c.lifetime_revenue/avgLifetime).toFixed(1):'—'}×</div><div class="sub">peer: ${fmt.uahK(avgLifetime)}</div></div><div class="kpi"><div class="lbl">🛒 AOV vs peer</div><div class="val">${avgAov?(Number(c.aov)/avgAov).toFixed(1):'—'}×</div><div class="sub">peer: ${fmt.uah(avgAov)}</div></div><div class="kpi"><div class="lbl">🔁 Транзакції vs peer</div><div class="val">${avgTx?(c.tx_count/avgTx).toFixed(1):'—'}×</div><div class="sub">peer: ${avgTx.toFixed(0)}</div></div><div class="kpi"><div class="lbl">🏆 Rank у каналі</div><div class="val">#${rank}</div><div class="sub">з ${all.length} клієнтів</div></div></div></div></div>
    <div class="sec"><h2>🎯 Cross-sell · SKU що peers купляють, а цей клієнт ще ні</h2><span class="badge">${cross.length}</span></div>
    <div class="cc">${cross.length===0?'<div class="empty">Усі SKU вже куплено або немає peers.</div>':cross.slice(0,10).map((x,i)=>`<div class="cs-row"><div class="rk">${i+1}</div><div class="nm">${escapeHtml(x.sku_name)}</div><div><span class="cat">${x.sku_category||'—'}</span></div><div class="val">${x.peer_buyers} клієнтів · ${fmt.uahK(x.peer_revenue)}</div></div>`).join('')}</div>
    <div class="sec"><h2>🔴 Прострочена дебіторка · рахунки клієнта</h2><span class="badge">${unpaidInvoices.length}</span></div>
    <div class="cc">${unpaidInvoices.length===0?'<div class="empty">✓ Усі рахунки оплачено.</div>':`<div class="tbl-scroll" style="max-height:320px"><div class="ar-row" style="font-weight:700;color:var(--muted);font-size:10px;text-transform:uppercase;background:#FAFAF5"><div class="dt">Дата</div><div class="nm">Рахунок</div><div class="num">Сума</div><div class="num">Не опл.</div><div class="num">Прострочка</div><div class="ag">Кор.</div></div>${unpaidInvoices.slice(0,50).map(i=>{const cls=i.aging_bucket==='current'?'current':i.aging_bucket==='1-30'?'b1':i.aging_bucket==='31-60'?'b2':i.aging_bucket==='61-90'?'b3':'b4';return `<div class="ar-row"><div class="dt">${fmt.date(i.invoice_date)}</div><div class="nm">${escapeHtml(truncate(i.invoice_name||'—',30))}</div><div class="num">${fmt.uahK(i.sum_uah)}</div><div class="num unpaid">${fmt.uahK(i.unpaid_uah)}</div><div class="num">${i.days_overdue>0?i.days_overdue+'д':'—'}</div><div class="ag ${cls}">${i.aging_bucket}</div></div>`;}).join('')}</div>`}</div>
    <div class="sec"><h2>👥 Контактні особи · decision makers</h2><span class="badge">${contacts.length}</span></div>
    <div class="cc">${contacts.length===0?`<div class="empty">${raw.phone||raw.email?`Основний контакт: ${raw.phone?'📞 '+escapeHtml(raw.phone):''} ${raw.email?'📧 '+escapeHtml(raw.email):''}`:'Контактні особи ще не синхронізовано. Запустіть sync contactpersons.'}</div>`:`<div class="g3">${contacts.map(p=>`<div class="cp-card"><div class="cp-name">${escapeHtml(p.name||'—')}</div>${p.position?`<div class="cp-pos">${escapeHtml(p.position)}</div>`:''}${p.phone?`<div class="cp-contact">📞 ${escapeHtml(p.phone)}</div>`:''}${p.email?`<div class="cp-contact">📧 ${escapeHtml(p.email)}</div>`:''}${p.description?`<div class="cp-contact" style="margin-top:6px;color:var(--muted)">${escapeHtml(truncate(p.description,60))}</div>`:''}</div>`).join('')}</div>`}</div>
    ${(raw.legal_address||raw.actual_address)?`<div class="sec"><h2>🏢 Адреси</h2></div><div class="g2">${raw.legal_address?`<div class="addr"><div class="addr-lbl">Юридична</div>${escapeHtml(raw.legal_address)}</div>`:''}${raw.actual_address?`<div class="addr"><div class="addr-lbl">Фактична / Доставка</div>${escapeHtml(raw.actual_address)}</div>`:''}</div>`:''}
    <div class="sec"><h2>🚀 Promo response · сплески замовлень (lift > 50%)</h2><span class="badge">${promo.length}</span></div>
    <div class="cc">${promo.length===0?'<div class="empty">Немає виявлених сплесків. Це коли денна виручка > 1.5× середнього.</div>':`<table class="dt"><thead><tr><th>Дата</th><th class="num">Виручка дня</th><th class="num">Baseline avg</th><th class="num">Lift</th></tr></thead><tbody>${promo.map(p=>`<tr><td>${fmt.date(p.promo_date)}</td><td class="num">${fmt.uahK(p.daily_rev)}</td><td class="num"><small>${fmt.uahK(p.baseline_avg)}</small></td><td class="num"><span class="tag tg">+${Number(p.lift_pct).toFixed(0)}%</span></td></tr>`).join('')}</tbody></table>`}</div>
    <div class="sec"><h2>📅 Активність по днях тижня</h2></div>
    <div class="cc"><div class="dow-grid">${dowGrid.map(d=>{if(d.cnt===0)return `<div class="dow-cell empty"><div class="dow-name">${d.name}</div><div class="dow-cnt">·</div></div>`;const intensity=Math.min(0.95,0.3+(d.cnt/maxDow)*0.7);return `<div class="dow-cell" style="background:rgba(0,17,84,${intensity})" title="${fmt.uah(d.rev)} · ${d.cnt} тр"><div class="dow-name">${d.name}</div><div class="dow-cnt">${d.cnt}</div></div>`;}).join('')}</div><div style="margin-top:10px;font-size:11px;color:var(--muted)">Найкращий день: ${dowGrid.sort((a,b)=>b.cnt-a.cnt)[0].name}</div></div>
    <div class="sec"><h2>📝 CRM-лог · комунікації</h2><button class="crm-add" onclick="openCrm('${c.counterparty_ms_id}', null)">+ Додати запис</button></div>
    <div class="cc">${crm.length===0?'<div class="empty">Ще немає записів.</div>':crm.map(n=>{const dueClass=n.next_date&&new Date(n.next_date)<=new Date()?' due':'';return `<div class="crm-row"><div class="crm-date">${fmt.date(n.note_date)}</div><div class="crm-type">${n.note_type}</div><div class="crm-text">${escapeHtml(n.summary)}${n.next_step?`<strong>→ ${escapeHtml(n.next_step)}</strong>`:''}</div><div class="crm-next${dueClass}">${n.next_date?'📅 '+fmt.date(n.next_date):''}</div><button class="crm-del" onclick="event.stopPropagation(); deleteCrm('${n.id}')" title="Видалити">✕</button></div>`;}).join('')}</div>
    <div class="sec"><h2>📅 Timeline транзакцій</h2><span class="badge">${timeline.length}</span></div>
    <div class="cc"><div class="timeline">${timeline.length===0?'<div class="empty">Немає</div>':timeline.map(t=>`<div class="tl-item"><div class="date">${fmt.date(t.date)}</div><div><div class="desc">${truncate(t.sku_name||'—',50)}</div><div class="qty">${t.qty} шт · ${t.channel_name||'—'}</div></div><div class="val">${fmt.uah(t.revenue_uah)}</div></div>`).join('')}</div></div>
    <div class="sec"><h2>🎯 Рекомендовані дії</h2></div>
    <div class="cc"><div style="font-size:13px;color:#444;line-height:1.8">${Number(pr.debt_uah)>5000?`<div>📞 <strong>Дзвонити по дебіторці:</strong> ${fmt.uahK(pr.debt_uah)} не оплачено.</div>`:''}${c.days_since_last_order>60?`<div>📞 <strong>Подзвонити:</strong> не замовляли ${c.days_since_last_order} днів.</div>`:''}${c.growth_90d_pct<-20?`<div>🔍 <strong>З'ясувати причину падіння:</strong> -${Math.abs(c.growth_90d_pct)}% за 90д.</div>`:''}${c.skus_purchased<5&&c.lifetime_revenue>20000?`<div>🎯 <strong>Cross-sell:</strong> купує ${c.skus_purchased} SKU при lifetime ${fmt.uahK(c.lifetime_revenue)}.</div>`:''}${(c.segment_label||'').includes('VIP')?`<div>💎 <strong>Утримати:</strong> VIP клієнт.</div>`:''}${c.tx_count===1?`<div>🆕 <strong>Welcome call:</strong> перше замовлення.</div>`:''}${cross.length>=3?`<div>🛒 <strong>Cross-sell pitch:</strong> ${cross.length} SKU peers купляють.</div>`:''}${Number(rt.return_rate_pct)>5?`<div>↩️ <strong>З'ясувати причину повернень:</strong> ${Number(rt.return_rate_pct).toFixed(1)}%.</div>`:''}${insights.filter(i=>i.cls==='green').length>0&&insights.filter(i=>i.cls==='red').length===0?`<div>✓ <strong>Усе добре</strong> — клієнт у здоровому стані.</div>`:''}</div></div>
    <div class="sec"><h2>📝 Картка контрагента (МойСклад)</h2></div>
    <div class="cc"><table class="dt" style="font-size:12px"><tr><th>Поле</th><th>Значення</th></tr><tr><td><strong>МС ID</strong></td><td><code style="font-size:11px">${c.counterparty_ms_id}</code></td></tr><tr><td><strong>Назва</strong></td><td>${escapeHtml(c.name)}</td></tr><tr><td><strong>ЄДРПОУ / ІНН</strong></td><td>${c.inn||'—'}</td></tr><tr><td><strong>Тип</strong></td><td>${c.company_type||'—'}</td></tr><tr><td><strong>Тип цін</strong></td><td>${c.price_type||'—'}</td></tr><tr><td><strong>Стан CRM</strong></td><td>${c.state||'—'}</td></tr><tr><td><strong>Канал</strong></td><td>${c.channel_name||'—'} <small style="color:var(--muted)">(${c.channel_id})</small></td></tr><tr><td><strong>Телефон</strong></td><td>${raw.phone||'—'}</td></tr><tr><td><strong>Email</strong></td><td>${raw.email||'—'}</td></tr><tr><td><strong>Юр. адреса</strong></td><td>${raw.legal_address||'—'}</td></tr><tr><td><strong>Фактична адреса</strong></td><td>${raw.actual_address||'—'}</td></tr><tr><td><strong>Перше / Останнє</strong></td><td>${fmt.date(c.first_order_date)} → ${fmt.date(c.last_order_date)}</td></tr></table></div>`;
  setTimeout(()=>{const ctx=$('custTrendChart');if(ctx){if(state.charts.custTrend)state.charts.custTrend.destroy();state.charts.custTrend=new Chart(ctx,{type:'bar',data:{labels:months.map(m=>{const[y,mo]=m.split('-');return new Date(parseInt(y),parseInt(mo)-1,1).toLocaleDateString('uk-UA',{month:'short',year:'2-digit'});}),datasets:[{label:'Виручка ₴',data:months.map(m=>byMonth[m]),backgroundColor:'#001154',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:(v)=>fmt.uahK(v)}}}}});}const ctx2=$('custHealthChart');if(ctx2&&healthHist.length>0){if(state.charts.custHealth)state.charts.custHealth.destroy();state.charts.custHealth=new Chart(ctx2,{type:'line',data:{labels:healthHist.map(h=>{const d=new Date(h.month);return d.toLocaleDateString('uk-UA',{month:'short',year:'2-digit'});}),datasets:[{label:'Health',data:healthHist.map(h=>h.health_score),backgroundColor:'rgba(57,180,74,.13)',borderColor:'#39B44A',borderWidth:2,tension:.3,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{min:0,max:100}}}});}const ctx3=$('custYoyChart');if(ctx3&&yoy.length>0){const years=[...new Set(yoy.map(y=>y.y))].sort();const colors={2025:'#3B82F6',2026:'#001154',2024:'#94a3b8'};const mn=['Січ','Лют','Бер','Кві','Тра','Чер','Лип','Сер','Вер','Жов','Лис','Гру'];const ds=years.map(y=>({label:String(y),data:mn.map((_,i)=>{const r=yoy.find(x=>x.y===y&&x.m===i+1);return r?Number(r.revenue_uah||0):0;}),backgroundColor:colors[y]||'#888',borderRadius:4}));if(state.charts.custYoy)state.charts.custYoy.destroy();state.charts.custYoy=new Chart(ctx3,{type:'bar',data:{labels:mn,datasets:ds},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{y:{ticks:{callback:(v)=>fmt.uahK(v)}}}}});}const ctx4=$('custShipPayChart');if(ctx4){const shipByMonth={};timeline.forEach(t=>{const m=t.date.slice(0,7);shipByMonth[m]=(shipByMonth[m]||0)+Number(t.revenue_uah||0);});const payByMonth={};payments.forEach(p=>{const m=p.moment.slice(0,7);payByMonth[m]=(payByMonth[m]||0)+Number(p.sum_uah||0);});const allMonths=[...new Set([...Object.keys(shipByMonth),...Object.keys(payByMonth)])].sort();const lbl=allMonths.map(m=>{const[y,mo]=m.split('-');return new Date(parseInt(y),parseInt(mo)-1,1).toLocaleDateString('uk-UA',{month:'short',year:'2-digit'});});if(state.charts.custShipPay)state.charts.custShipPay.destroy();state.charts.custShipPay=new Chart(ctx4,{type:'bar',data:{labels:lbl,datasets:[{label:'Відвантажено',data:allMonths.map(m=>shipByMonth[m]||0),backgroundColor:'#3B82F6',borderRadius:4},{label:'Оплачено',data:allMonths.map(m=>payByMonth[m]||0),backgroundColor:'#39B44A',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{y:{ticks:{callback:(v)=>fmt.uahK(v)}}}}});}},50);
}
function healthCircle(score){const r=48,cx=60,cy=60,circ=2*Math.PI*r;const offset=circ*(1-(score||0)/100);const color=score>=70?'#39B44A':score>=40?'#F59E0B':'#E84040';return `<svg width="120" height="120" viewBox="0 0 120 120"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#EEE" stroke-width="8"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-dasharray="${circ}" stroke-dashoffset="${offset}" stroke-linecap="round" /></svg>`;}
function openCrm(custMsId,noteId){$('crmModal').classList.add('open');$('crmEditId').value=noteId||'';if(noteId){const n=state.customerCrm.find(x=>x.id===noteId);if(n){$('crmDate').value=n.note_date;$('crmType').value=n.note_type;$('crmSummary').value=n.summary;$('crmNextStep').value=n.next_step||'';$('crmNextDate').value=n.next_date||'';}}else{$('crmDate').value=new Date().toISOString().slice(0,10);$('crmType').value='📞 Дзвінок';$('crmSummary').value='';$('crmNextStep').value='';$('crmNextDate').value='';}}
function closeCrm(){$('crmModal').classList.remove('open');}
async function saveCrm(){const summary=$('crmSummary').value.trim();if(!summary)return toast('Заповніть «Про що»',true);const payload={counterparty_ms_id:state.customer.counterparty_ms_id,note_date:$('crmDate').value,note_type:$('crmType').value,summary,next_step:$('crmNextStep').value||null,next_date:$('crmNextDate').value||null};const editId=$('crmEditId').value;try{if(editId)await api(`crm_notes?id=eq.${editId}`,{method:'PATCH',body:JSON.stringify(payload)});else await api('crm_notes',{method:'POST',body:JSON.stringify(payload)});toast('✓ Збережено');closeCrm();selectCustomer(state.customer.counterparty_ms_id);}catch(e){toast('Помилка: '+e.message,true);}}
async function deleteCrm(id){if(!confirm('Видалити запис?'))return;try{await api(`crm_notes?id=eq.${id}`,{method:'DELETE'});toast('✓ Видалено');selectCustomer(state.customer.counterparty_ms_id);}catch(e){toast('Помилка: '+e.message,true);}}
$('searchInput').addEventListener('input',(e)=>{const q=e.target.value.toLowerCase().trim();if(!q||q.length<2){$('autocomplete').className='autocomplete';return;}const matches=state.data.customers.filter(c=>(c.name||'').toLowerCase().includes(q)||(c.inn||'').includes(q)).slice(0,20);$('autocomplete').innerHTML=matches.length===0?'<div class="ac-item"><div class="name">Не знайдено</div></div>':matches.map(c=>`<div class="ac-item" onclick="selectCustomer('${c.counterparty_ms_id}')"><div class="name">${escapeHtml(c.name)}</div><span class="ch">${c.channel_name||'—'}</span><small style="color:var(--muted)">${fmt.uahK(c.lifetime_revenue)}</small></div>`).join('');$('autocomplete').className='autocomplete show';});
document.addEventListener('click',(e)=>{if(!e.target.closest('.search'))$('autocomplete').className='autocomplete';});
$('backBtn').addEventListener('click',renderOverview);
window.selectCustomer=selectCustomer;window.filterByRF=filterByRF;window.filterByCohort=filterByCohort;window.renderOverview=renderOverview;window.openCrm=openCrm;window.closeCrm=closeCrm;window.saveCrm=saveCrm;window.deleteCrm=deleteCrm;window.setPeriod=setPeriod;window.setMoverTab=setMoverTab;
loadAll();
</script>
</body>
