<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer 360 · Barpi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/bb.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--y:#001154;--y-soft:rgba(0,17,84,.13);--g:#39B44A;--g-soft:rgba(57,180,74,.13);--r:#E84040;--r-soft:rgba(232,64,64,.10);--bl:#3B82F6;--or:#F59E0B;--d:#1A1A1A;--bg:#FAF7F7;--card:#fff;--muted:#888;--border:#E5E5DC;--line:#EEE}
body{background:var(--bg);font-family:Rubik,-apple-system,sans-serif;color:var(--d);margin:0}
.c360-top{position:sticky;top:0;z-index:200;background:var(--d);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px;border-bottom:3px solid var(--y)}
.c360-top h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
.c360-top .sub{font-size:11px;opacity:.6;font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.c360-top .spacer{flex:1}
.c360-top .sync{font-size:12px;opacity:.7;display:flex;align-items:center;gap:6px}
.c360-top .dot{width:8px;height:8px;border-radius:50%;background:var(--g)}
.c360-wrap{max-width:1440px;margin:0 auto;padding:20px 24px 40px}
.sec{margin:24px 0 12px;display:flex;align-items:center;gap:10px}
.sec h2{margin:0;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sec .badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--y-soft);color:var(--y)}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.g2,.g3,.g4,.g5{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi .lbl{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.kpi .val{font-size:22px;font-weight:800;color:var(--d);letter-spacing:-.02em;line-height:1.1}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:6px}
.kpi.cy{border-bottom:3px solid var(--y)}.kpi.cg{border-bottom:3px solid var(--g)}.kpi.cr{border-bottom:3px solid var(--r)}.kpi.cb{border-bottom:3px solid var(--bl)}.kpi.co{border-bottom:3px solid var(--or)}
.cc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.cc-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cc-head h3{margin:0;font-size:14px;font-weight:700}.cc-head .pill{font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--y-soft);color:var(--y);text-transform:uppercase}
.chart-wrap{position:relative;height:280px}
.chart-wrap.tall{height:360px}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt th{text-align:left;padding:8px 12px;font-weight:700;font-size:10px;text-transform:uppercase;color:var(--muted);background:#FAFAF5;border-bottom:1px solid var(--line)}
table.dt td{padding:9px 12px;border-bottom:1px solid #F4F4F0}.dt td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.tbl-scroll{max-height:560px;overflow:auto;border-radius:8px;border:1px solid var(--line)}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px}
.tag.tg{background:var(--g-soft);color:var(--g)}.tag.tr{background:var(--r-soft);color:var(--r)}.tag.ty{background:var(--y-soft);color:var(--y)}.tag.tb{background:rgba(59,130,246,.13);color:var(--bl)}
.loading{text-align:center;padding:60px;color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header class="c360-top">
  <h1>👥 Barpi · <span class="sub">Customer 360</span></h1>
  <span class="spacer"></span>
  <span class="sync"><span class="dot"></span><span id="syncLabel">Завантаження…</span></span>
</header>
<div class="c360-wrap">
  <div id="loadingBox" class="loading">Завантаження…</div>
  <div id="contentBox" style="display:none"></div>
</div>
<script src="../../assets/bb.js"></script>
<script>
const API_URL='https://barpi-api.vg-ab6.workers.dev';
const $=(id)=>document.getElementById(id);
const fmt={uah:(n)=>new Intl.NumberFormat('uk-UA').format(Math.round(n||0))+' ₴',uahK:(n)=>n>=1e6?(n/1e6).toFixed(1)+'M ₴':n>=1e3?(n/1e3).toFixed(0)+'K ₴':Math.round(n||0)+' ₴',num:(n)=>new Intl.NumberFormat('uk-UA').format(n||0),date:(s)=>{if(!s)return '—';const d=new Date(s);return d.toLocaleDateString('uk-UA',{day:'2-digit',month:'2-digit',year:'2-digit'});},month:(s)=>{const d=new Date(s);return d.toLocaleDateString('uk-UA',{month:'short',year:'2-digit'});}};
function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function truncate(s,n){return (s||'').length>n?s.slice(0,n)+'…':s;}
async function api(p){const r=await fetch(API_URL+'/'+p,{headers:{'Content-Type':'application/json'}});if(!r.ok){if(r.status===404)return [];throw new Error('API '+r.status);}return r.json();}
let charts={};
async function load(){
  try{
    const [metrics,timeline,dow,kpis,sync]=await Promise.all([
      api('v_customer_metrics?select=*&order=lifetime_revenue.desc'),
      api('v_customer_timeline?select=*&order=month'),
      api('v_customer_dow?select=*'),
      api('v_dashboard_kpis?select=*'),
      api('sync_state?entity=eq.demand&select=last_synced_at&limit=1'),
    ]);
    $('loadingBox').style.display='none';$('contentBox').style.display='block';
    if(sync[0]&&sync[0].last_synced_at){const h=Math.floor((Date.now()-new Date(sync[0].last_synced_at).getTime())/3600000);$('syncLabel').textContent=`Sync ${h}h тому · ${metrics.length} клієнтів`;}else{$('syncLabel').textContent=`${metrics.length} клієнтів · D1 live`;}
    render({metrics,timeline,dow,kpis:kpis[0]||{}});
  }catch(e){console.error(e);$('syncLabel').textContent='Помилка: '+e.message;}
}
function rfmScore(m){
  // R: дні з останньої покупки (менше = краще)
  const r = m.days_since_last_purchase ?? 999;
  const recencyScore = r<=30?5 : r<=60?4 : r<=90?3 : r<=180?2 : 1;
  const f = m.total_orders ?? 0;
  const frequencyScore = f>=10?5 : f>=5?4 : f>=3?3 : f>=2?2 : 1;
  const v = m.lifetime_revenue ?? 0;
  const valueScore = v>=100000?5 : v>=50000?4 : v>=10000?3 : v>=5000?2 : 1;
  return {r:recencyScore, f:frequencyScore, v:valueScore, total:recencyScore+frequencyScore+valueScore};
}
function segment(score){
  if (score.total >= 13) return {name:'🏆 Champions', cls:'tg'};
  if (score.r >= 4 && score.f >= 4) return {name:'💎 Loyal', cls:'tb'};
  if (score.r >= 4 && score.v >= 4) return {name:'⭐ Big spenders', cls:'ty'};
  if (score.r <= 2 && score.f >= 3) return {name:'😟 At risk', cls:'tr'};
  if (score.r <= 2) return {name:'💤 Sleeping', cls:'tr'};
  return {name:'🆕 New / Casual', cls:'tb'};
}

function render(d){
  const {metrics,timeline,dow,kpis}=d;
  const totalCust = metrics.length;
  const activeCust = metrics.filter(m => (m.days_since_last_purchase??999) <= 90).length;
  const churning = metrics.filter(m => (m.days_since_last_purchase??0) > 90 && (m.days_since_last_purchase??0) <= 180).length;
  const lost = metrics.filter(m => (m.days_since_last_purchase??0) > 180).length;
  const lifetime = metrics.reduce((s,m) => s+Number(m.lifetime_revenue||0), 0);
  const avgLtv = totalCust>0 ? lifetime/totalCust : 0;
  // Segments
  const segs={};
  metrics.forEach(m => {
    const score = rfmScore(m);
    const seg = segment(score);
    if (!segs[seg.name]) segs[seg.name] = {cls:seg.cls, count:0, rev:0};
    segs[seg.name].count++;
    segs[seg.name].rev += Number(m.lifetime_revenue||0);
  });
  const segRows = Object.entries(segs).map(([k,v])=>({name:k,...v})).sort((a,b)=>b.rev-a.rev);

  $('contentBox').innerHTML=`
    <div class="sec"><h2>👥 KPI клієнтів</h2></div>
    <div class="g5">
      <div class="kpi cy"><div class="lbl">👥 Всього клієнтів</div><div class="val">${fmt.num(totalCust)}</div><div class="sub">lifetime</div></div>
      <div class="kpi cg"><div class="lbl">✅ Активні (90д)</div><div class="val">${fmt.num(activeCust)}</div><div class="sub">${totalCust?(activeCust/totalCust*100).toFixed(0):0}%</div></div>
      <div class="kpi co"><div class="lbl">⚠ Churning (90-180д)</div><div class="val">${fmt.num(churning)}</div><div class="sub">потенц. лост</div></div>
      <div class="kpi cr"><div class="lbl">💤 Лост (180+д)</div><div class="val">${fmt.num(lost)}</div><div class="sub">не купували</div></div>
      <div class="kpi cb"><div class="lbl">💰 Avg LTV</div><div class="val">${fmt.uahK(avgLtv)}</div><div class="sub">грн/клієнт</div></div>
    </div>

    <div class="sec"><h2>🎯 RFM сегментація</h2></div>
    <div class="cc">
      <table class="dt">
        <thead><tr><th>Сегмент</th><th class="num">Клієнтів</th><th class="num">% від базу</th><th class="num">Виручка</th><th class="num">% виручки</th></tr></thead>
        <tbody>${segRows.map(s => `<tr><td><span class="tag ${s.cls}">${s.name}</span></td><td class="num">${s.count}</td><td class="num">${totalCust?(s.count/totalCust*100).toFixed(1):0}%</td><td class="num">${fmt.uahK(s.rev)}</td><td class="num">${lifetime?(s.rev/lifetime*100).toFixed(1):0}%</td></tr>`).join('')}</tbody>
      </table>
    </div>

    <div class="sec"><h2>📈 Динаміка клієнтської бази (по місяцях)</h2></div>
    <div class="cc"><div class="chart-wrap tall"><canvas id="timelineChart"></canvas></div></div>

    <div class="sec"><h2>📅 День тижня · виручка</h2></div>
    <div class="g2">
      <div class="cc"><div class="chart-wrap"><canvas id="dowChart"></canvas></div></div>
      <div class="cc">
        <div class="cc-head"><h3>📊 По днях</h3></div>
        <table class="dt">
          <thead><tr><th>День</th><th class="num">Замовлень</th><th class="num">Виручка</th><th class="num">Avg</th></tr></thead>
          <tbody>${dow.map(d => `<tr><td><strong>${d.dow_name||'—'}</strong></td><td class="num">${d.orders||0}</td><td class="num">${fmt.uahK(d.revenue||0)}</td><td class="num">${fmt.uah(d.avg_order||0)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Немає</td></tr>'}</tbody>
        </table>
      </div>
    </div>

    <div class="sec"><h2>🏆 ТОП клієнтів за LTV</h2><span class="badge">${metrics.length}</span></div>
    <div class="cc"><div class="tbl-scroll"><table class="dt">
      <thead><tr><th>#</th><th>Клієнт</th><th class="num">Замовлень</th><th class="num">Шт</th><th class="num">LTV ₴</th><th class="num">Avg чек</th><th>Перше</th><th>Останнє</th><th class="num">Днів</th><th>Сегмент</th></tr></thead>
      <tbody>${metrics.slice(0,200).map((m,i) => {
        const score = rfmScore(m);
        const seg = segment(score);
        return `<tr>
          <td>${i+1}</td>
          <td><strong>${escapeHtml(truncate(m.counterparty_name||'— невідомий —',32))}</strong></td>
          <td class="num">${m.total_orders||0}</td>
          <td class="num">${Number(m.total_qty||0).toFixed(0)}</td>
          <td class="num">${fmt.uahK(m.lifetime_revenue)}</td>
          <td class="num">${fmt.uah(m.avg_order_value||0)}</td>
          <td><small>${fmt.date(m.first_purchase)}</small></td>
          <td><small>${fmt.date(m.last_purchase)}</small></td>
          <td class="num">${m.days_since_last_purchase??'—'}</td>
          <td><span class="tag ${seg.cls}">${seg.name}</span></td>
        </tr>`;
      }).join('')||'<tr><td colspan="10" class="empty">Немає</td></tr>'}</tbody>
    </table></div></div>
  `;
  setTimeout(()=>{
    if(charts.timeline)charts.timeline.destroy();
    charts.timeline=new Chart($('timelineChart'),{
      type:'bar',
      data:{labels:timeline.map(t=>fmt.month(t.month)),datasets:[
        {label:'Активні клієнти',data:timeline.map(t=>Number(t.active_customers||0)),backgroundColor:'#39B44A',borderRadius:4,yAxisID:'y'},
        {label:'Нові клієнти',data:timeline.map(t=>Number(t.new_customers||0)),backgroundColor:'#3B82F6',borderRadius:4,yAxisID:'y'},
        {label:'Виручка ₴',data:timeline.map(t=>Number(t.revenue||0)),type:'line',borderColor:'#001154',backgroundColor:'transparent',borderWidth:2.5,tension:.3,pointRadius:3,yAxisID:'y1'},
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{y:{position:'left',title:{display:true,text:'Клієнти'}},y1:{position:'right',ticks:{callback:(v)=>fmt.uahK(v)},grid:{drawOnChartArea:false}}}}
    });
    if(charts.dow)charts.dow.destroy();
    charts.dow=new Chart($('dowChart'),{
      type:'bar',
      data:{labels:dow.map(d=>d.dow_name||'—'),datasets:[{label:'Виручка',data:dow.map(d=>Number(d.revenue||0)),backgroundColor:'#001154',borderRadius:4}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:(v)=>fmt.uahK(v)}}}}
    });
  },50);
}
load();
</script>
</body>
</html>
