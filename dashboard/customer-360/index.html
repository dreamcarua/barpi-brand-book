<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer 360 · Barpi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/bb.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--y:#001154;--y-soft:rgba(0,17,84,.13);--y-light:#BAD9F4;--g:#39B44A;--g-soft:rgba(57,180,74,.13);--r:#E84040;--r-soft:rgba(232,64,64,.10);--bl:#3B82F6;--bl-soft:rgba(59,130,246,.10);--or:#F59E0B;--or-soft:rgba(245,158,11,.13);--d:#1A1A1A;--bg:#FAF7F7;--card:#fff;--muted:#888;--border:#E5E5DC;--line:#EEE}
body{background:var(--bg);font-family:Rubik,-apple-system,sans-serif;color:var(--d);margin:0}
.cp-topbar{position:sticky;top:0;z-index:200;background:var(--d);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px;border-bottom:3px solid var(--y)}
.cp-topbar h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
.cp-topbar .sub{font-size:11px;opacity:.6;font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.cp-topbar .spacer{flex:1}
.cp-topbar .sync{font-size:12px;opacity:.7;display:flex;align-items:center;gap:6px}
.cp-topbar .dot{width:8px;height:8px;border-radius:50%;background:var(--g)}
.cp-selector{position:sticky;top:48px;z-index:150;background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;display:flex;gap:10px;align-items:center;justify-content:center}
.cp-selector .search{flex:1;max-width:520px;position:relative}
.cp-selector input{width:100%;font-family:Rubik;font-size:14px;padding:10px 14px 10px 38px;border:1px solid var(--border);border-radius:99px;background:#fff;color:var(--d);outline:none}
.cp-selector input:focus{border-color:var(--y);box-shadow:0 0 0 3px var(--y-soft)}
.cp-selector .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--muted)}
.cp-selector .back{font-family:Rubik;font-size:13px;font-weight:600;padding:8px 16px;border-radius:99px;border:none;background:var(--y);color:#fff;cursor:pointer}
.autocomplete{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:8px;margin-top:4px;max-height:340px;overflow:auto;box-shadow:0 8px 24px rgba(0,17,84,.08);z-index:100;display:none}
.autocomplete.show{display:block}
.ac-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13px;display:flex;align-items:center;gap:8px}
.ac-item:hover{background:var(--y-soft)}
.ac-item .name{flex:1;font-weight:600}
.ac-item .ch{font-size:10px;padding:2px 6px;border-radius:99px;background:var(--y-soft);color:var(--y)}
.cp-wrap{max-width:1440px;margin:0 auto;padding:20px 24px 40px}
.sec{margin:24px 0 12px;display:flex;align-items:center;gap:10px}
.sec h2{margin:0;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sec .badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--y-soft);color:var(--y)}
.g1{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:900px){.g2,.g3,.g4,.g5{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;transition:all .2s}
.kpi:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,17,84,.06)}
.kpi .lbl{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.kpi .val{font-size:22px;font-weight:800;color:var(--d);letter-spacing:-.02em;line-height:1.1}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:6px}
.kpi.cy{border-bottom:3px solid var(--y)}.kpi.cg{border-bottom:3px solid var(--g)}.kpi.cr{border-bottom:3px solid var(--r)}.kpi.cb{border-bottom:3px solid var(--bl)}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:11px;padding:2px 7px;border-radius:99px}
.delta.up{background:var(--g-soft);color:var(--g)}.delta.dn{background:var(--r-soft);color:var(--r)}.delta.neu{background:#f3f3f3;color:#777}
.cc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.cc-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cc-head h3{margin:0;font-size:14px;font-weight:700;color:var(--d)}
.cc-head .pill{font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--y-soft);color:var(--y);text-transform:uppercase}
.rfm-grid{display:grid;grid-template-columns:120px repeat(3,1fr);gap:6px;font-size:12px}
.rfm-cell{padding:14px 12px;text-align:center;border-radius:8px;color:#fff;font-weight:700;cursor:pointer;transition:all .15s}
.rfm-cell:hover{transform:scale(1.02);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.rfm-cell .cnt{font-size:22px;line-height:1}
.rfm-cell .lbl{font-size:10px;opacity:.9;margin-top:4px}
.rfm-row-lbl{display:flex;align-items:center;justify-content:flex-end;padding-right:10px;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase}
.rfm-col-lbl{text-align:center;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;padding-bottom:4px}
.mover-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.mover-card h4{margin:0 0 10px;font-size:13px;font-weight:700;color:var(--d)}
.mover-row{display:grid;grid-template-columns:24px 1fr 80px 70px;gap:8px;font-size:12px;padding:6px 4px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.mover-row:hover{background:var(--y-soft);border-radius:4px}
.mover-row .rk{color:var(--muted);font-weight:700;font-size:11px}
.mover-row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mover-row .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--y);font-weight:700}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt th{text-align:left;padding:8px 12px;font-weight:700;font-size:10px;text-transform:uppercase;color:var(--muted);background:#FAFAF5;border-bottom:1px solid var(--line);letter-spacing:.05em}
table.dt td{padding:9px 12px;border-bottom:1px solid #F4F4F0;color:var(--d)}
table.dt tbody tr{cursor:pointer}
table.dt tbody tr:hover{background:#FBFAF5}
table.dt td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.tbl-scroll{max-height:400px;overflow:auto;border-radius:8px;border:1px solid var(--line)}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.04em}
.tag.ty{background:var(--y-soft);color:var(--y)}.tag.tg{background:var(--g-soft);color:var(--g)}.tag.tr{background:var(--r-soft);color:var(--r)}.tag.tor{background:var(--or-soft);color:var(--or)}
.cust-header{background:linear-gradient(135deg,var(--d) 0%,#2A2A2A 100%);color:#fff;padding:28px 32px;border-radius:16px;margin-bottom:20px;position:relative;overflow:hidden}
.cust-header::before{content:"";position:absolute;top:-50%;right:-10%;width:400px;height:400px;background:radial-gradient(circle,rgba(186,217,244,.15),transparent 70%);pointer-events:none}
.cust-header .cust-name{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0 0 8px;position:relative}
.cust-meta{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;opacity:.85;position:relative}
.cust-tags{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap;position:relative}
.cust-tag{font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;background:rgba(186,217,244,.2);border:1px solid rgba(186,217,244,.3);color:#fff}
.cust-tag.seg{background:var(--y-light);color:var(--y)}
.health-hero{display:flex;align-items:center;gap:24px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:16px}
.health-circle{width:120px;height:120px;flex-shrink:0;position:relative}
.health-circle svg{transform:rotate(-90deg)}
.health-circle .val{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:32px;font-weight:800;color:var(--d);letter-spacing:-.02em}
.health-circle .lbl{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.health-info{flex:1}
.health-info h3{margin:0 0 8px;font-size:18px;font-weight:700;color:var(--d)}
.health-info .components{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.health-comp{padding:6px 12px;background:#FAFAF5;border-radius:8px;font-size:12px;color:var(--muted)}
.health-comp strong{color:var(--d);font-weight:700}
.timeline{max-height:480px;overflow:auto;border-radius:8px;border:1px solid var(--line)}
.tl-item{display:grid;grid-template-columns:80px 1fr 120px;gap:14px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center;font-size:13px}
.tl-item:hover{background:#FBFAF5}
.tl-item .date{font-size:11px;font-weight:600;color:var(--muted)}
.tl-item .desc{font-weight:500;color:var(--d)}
.tl-item .qty{font-size:11px;color:var(--muted);margin-top:2px}
.tl-item .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--y);font-weight:700}
.insight{padding:14px;background:#fff;border:1px solid var(--line);border-radius:10px;border-left:4px solid var(--y)}
.insight.green{border-left-color:var(--g);background:#F6FDF7}
.insight.red{border-left-color:var(--r);background:#FEF6F6}
.insight.yellow{border-left-color:var(--or);background:#FFFBEE}
.insight h4{margin:0 0 6px;font-size:13px;font-weight:700;color:var(--d);display:flex;align-items:center;gap:6px}
.insight p{margin:0;font-size:12px;color:#555;line-height:1.5}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:13px}
.placeholder{padding:20px;background:#FBFAF5;border:1px dashed var(--border);border-radius:10px;color:var(--muted);font-size:13px;text-align:center}
.toast{position:fixed;bottom:24px;right:24px;background:var(--d);color:#fff;padding:14px 22px;border-radius:10px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;transform:translateY(8px);transition:all .25s;z-index:1000}
.toast.show{opacity:1;transform:translateY(0)}
.toast.err{background:var(--r)}
.chart-wrap{position:relative;height:280px}
.chart-wrap.tall{height:340px}
.dow-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow-cell{padding:14px 6px;text-align:center;border-radius:6px;color:#fff;font-weight:700;font-size:12px}
.dow-cell.empty{background:#F4F4F0;color:#bbb}
.dow-cell .dow-name{font-size:9px;opacity:.85;text-transform:uppercase;margin-bottom:4px}
.dow-cell .dow-cnt{font-size:14px;line-height:1}
.crm-row{display:grid;grid-template-columns:90px 110px 1fr 140px 30px;gap:10px;padding:10px 0;border-bottom:1px dashed var(--border);align-items:start;font-size:13px}
.crm-row:last-child{border:none}
.crm-row .crm-date{font-weight:700;color:var(--d);font-size:12px}
.crm-row .crm-type{font-size:11px;font-weight:600;color:#555;padding:2px 8px;border-radius:8px;background:#F1F1EB;white-space:nowrap;text-align:center}
.crm-row .crm-text{color:#333;line-height:1.5}
.crm-row .crm-text strong{display:block;color:var(--d);margin-top:4px;font-size:11.5px}
.crm-row .crm-next{font-size:11px;color:var(--muted);text-align:right}
.crm-row .crm-next.due{color:var(--r);font-weight:700}
.crm-del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;opacity:.4}
.crm-row:hover .crm-del{opacity:1}
.crm-add{background:var(--y);color:#fff;border:0;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.crm-add:hover{background:#0a1f7a}
.crm-modal{position:fixed;inset:0;background:rgba(30,30,30,.7);z-index:9990;display:none;align-items:center;justify-content:center;padding:20px}
.crm-modal.open{display:flex}
.crm-modal-card{background:#fff;border-radius:14px;padding:24px 26px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.crm-modal-title{font-size:16px;font-weight:800;color:var(--d);margin-bottom:14px}
.crm-modal label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:10px 0 4px}
.crm-modal input,.crm-modal textarea,.crm-modal select{width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;outline:none;box-sizing:border-box}
.crm-modal input:focus,.crm-modal textarea:focus,.crm-modal select:focus{border-color:var(--y)}
.crm-modal textarea{min-height:70px;resize:vertical}
.crm-modal-actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.crm-modal-btn{padding:9px 18px;border-radius:8px;border:0;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;text-transform:uppercase;letter-spacing:.3px}
.crm-modal-btn.cancel{background:#F1F1EB;color:#666}
.crm-modal-btn.save{background:var(--y);color:#fff}
.cs-row{display:grid;grid-template-columns:24px 1fr 100px 80px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
.cs-row:last-child{border:none}
.cs-row .rk{color:var(--muted);font-weight:700;font-size:11px}
.cs-row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs-row .val{text-align:right;font-weight:700;color:var(--y)}
.cs-row .cat{font-size:10px;padding:2px 6px;border-radius:99px;background:var(--y-soft);color:var(--y)}
.period-chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{font-family:Rubik;font-size:12px;font-weight:600;padding:7px 16px;border-radius:99px;border:1px solid var(--border);background:#fff;color:var(--d);cursor:pointer;transition:all .15s}
.chip:hover:not(.active){background:var(--y-soft);border-color:var(--y)}
.chip.active{background:var(--y);color:#fff;border-color:var(--y);box-shadow:0 2px 8px rgba(0,17,84,.2)}
.period-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:6px}
.prod-row{display:grid;grid-template-columns:30px 1fr 90px 70px 90px 70px;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);font-size:12.5px;cursor:default}
.prod-row:hover{background:#FBFAF5}
.prod-row .rk{color:var(--muted);font-weight:700;font-size:11px;text-align:center}
.prod-row .nm{font-weight:600;color:var(--d);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prod-row .cat{font-size:10px;padding:2px 8px;border-radius:99px;background:var(--y-soft);color:var(--y);text-align:center;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.prod-row .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.prod-row .num.rev{color:var(--y);font-weight:800}
.prod-row .num.cust{color:var(--g);font-weight:700}
.prod-bar{position:relative;height:4px;background:var(--y-soft);border-radius:99px;margin-top:4px;overflow:hidden}
.prod-bar-fill{position:absolute;top:0;left:0;height:100%;background:var(--y);border-radius:99px;transition:width .25s}
@media print{.cp-topbar,.cp-selector,.toast,.crm-modal{display:none}.cp-wrap{max-width:none;padding:0}body{background:#fff}.cc{box-shadow:none;page-break-inside:avoid}}
</style>
</head>
<body>
<div id="bb-shell"></div>
<main class="bb-main" id="bb-main" style="padding:0">
<header class="cp-topbar">
  <h1>👥 Barpi · <span class="sub">Customer 360</span></h1>
  <span class="spacer"></span>
  <span class="sync"><span class="dot"></span><span id="syncLabel">Завантаження…</span></span>
</header>
<div class="cp-selector">
  <div class="search">
    <span class="ico">🔍</span>
    <input type="text" id="searchInput" placeholder="Пошук клієнта: ім'я, ЄДРПОУ…" autocomplete="off">
    <div id="autocomplete" class="autocomplete"></div>
  </div>
  <button class="back" id="backBtn" style="display:none">← Назад до огляду</button>
</div>
<div class="cp-wrap" id="contentWrap"></div>
</main>
<!-- CRM Modal -->
<div class="crm-modal" id="crmModal">
  <div class="crm-modal-card">
    <div class="crm-modal-title">📝 Новий запис у CRM-лог</div>
    <input type="hidden" id="crmEditId" value="">
    <label>Дата</label><input type="date" id="crmDate">
    <label>Тип</label>
    <select id="crmType">
      <option>📞 Дзвінок</option><option>📧 Email</option><option>💬 Чат / Telegram</option>
      <option>🤝 Зустріч</option><option>📦 Відвантаження</option><option>💰 Оплата</option>
      <option>⚠️ Скарга / повернення</option><option>📋 Пропозиція</option><option>📝 Інше</option>
    </select>
    <label>Про що</label><textarea id="crmSummary" placeholder="Про що говорили, які домовленості…"></textarea>
    <label>Наступний крок</label><input type="text" id="crmNextStep" placeholder="Напр.: підготувати КП на нову лінійку">
    <label>Дата наступного кроку</label><input type="date" id="crmNextDate">
    <div class="crm-modal-actions">
      <button class="crm-modal-btn cancel" onclick="closeCrm()">Скасувати</button>
      <button class="crm-modal-btn save" onclick="saveCrm()">Зберегти</button>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="../../assets/bb.js"></script>
<script>
const SUPA_URL = 'https://zrcqmwlpsggiqgipvxhv.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpyY3Ftd2xwc2dnaXFnaXB2eGh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MzcyMTYsImV4cCI6MjA5NTUxMzIxNn0.ROzbQ6aGRs-9rDVIDv0UyzlrvBRWFmFMQ7n77bLALmY';
const $ = (id) => document.getElementById(id);
const fmt = {
  uah: (n) => new Intl.NumberFormat('uk-UA').format(Math.round(n||0)) + ' ₴',
  uahK: (n) => n >= 1e6 ? (n/1e6).toFixed(1)+'M ₴' : n >= 1e3 ? (n/1e3).toFixed(0)+'K ₴' : Math.round(n)+' ₴',
  num: (n) => new Intl.NumberFormat('uk-UA').format(n||0),
  date: (s) => { if(!s) return '—'; const d = new Date(s); return d.toLocaleDateString('uk-UA',{day:'2-digit',month:'2-digit',year:'2-digit'}); },
};
function ago(d){ if(!d) return '—'; const days = Math.floor((Date.now() - new Date(d).getTime())/86400000); if(days<1) return 'сьогодні'; if(days<2) return 'вчора'; if(days<30) return days+' дн.'; if(days<60) return '~1 міс'; return Math.floor(days/30)+' міс'; }
function deltaPct(curr, prev){ if (!prev) return null; return ((curr - prev) / prev * 100); }
function deltaTag(pct){ if (pct == null) return '<span class="delta neu">—</span>'; const cls = pct > 0.5 ? 'up' : pct < -0.5 ? 'dn' : 'neu'; const sign = pct > 0 ? '↑' : pct < 0 ? '↓' : '→'; return `<span class="delta ${cls}">${sign} ${Math.abs(pct).toFixed(1)}%</span>`; }
function toast(msg, isErr=false){ const t = $('toast'); t.textContent = msg; t.className = 'toast show' + (isErr?' err':''); setTimeout(() => t.className = 'toast', 2800); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function truncate(s, n){ return (s||'').length > n ? s.slice(0, n) + '…' : s; }
function healthBadge(score){ if (score == null) return '—'; const cls = score >= 70 ? 'tg' : score >= 40 ? 'tor' : 'tr'; return `<span class="tag ${cls}">${score}</span>`; }
async function api(path, opts={}){
  const r = await fetch(SUPA_URL + '/rest/v1/' + path, {
    ...opts,
    headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation', ...(opts.headers||{}) },
  });
  if(!r.ok) throw new Error('API ' + r.status + ': ' + (await r.text()).slice(0,200));
  return r.json();
}

function aggByPeriod(period){
  const tx = state.data.allTx || [];
  const now = Date.now();
  const cutoff = period > 0 ? now - period * 86400000 : null;
  const prevCutoffStart = period > 0 ? now - 2 * period * 86400000 : null;
  const curr = cutoff ? tx.filter(t => new Date(t.date).getTime() >= cutoff) : tx;
  const prev = period > 0 ? tx.filter(t => { const d = new Date(t.date).getTime(); return d < cutoff && d >= prevCutoffStart; }) : [];
  // SKU agg
  const skuMap = {};
  curr.forEach(t => {
    if (!t.sku_id) return;
    const k = t.sku_id;
    if (!skuMap[k]) skuMap[k] = { sku_id: k, sku_name: t.sku_name || '—', sku_category: t.sku_category || '—', revenue: 0, qty: 0, tx: 0, customers: new Set() };
    skuMap[k].revenue += Number(t.revenue_uah || 0);
    skuMap[k].qty += Number(t.quantity || 0);
    skuMap[k].tx += 1;
    if (t.counterparty_ms_id) skuMap[k].customers.add(t.counterparty_ms_id);
  });
  const topSku = Object.values(skuMap).map(s => ({ ...s, customers: s.customers.size })).sort((a,b) => b.revenue - a.revenue);
  // Customer agg
  const custMap = {};
  curr.forEach(t => { if (!t.counterparty_ms_id) return; const k = t.counterparty_ms_id; if (!custMap[k]) custMap[k] = { rev: 0, tx: 0 }; custMap[k].rev += Number(t.revenue_uah||0); custMap[k].tx += 1; });
  const prevCustMap = {};
  prev.forEach(t => { if (!t.counterparty_ms_id) return; const k = t.counterparty_ms_id; if (!prevCustMap[k]) prevCustMap[k] = { rev: 0 }; prevCustMap[k].rev += Number(t.revenue_uah||0); });
  return { curr, prev, topSku, custMap, prevCustMap, revCurr: curr.reduce((s,t)=>s+Number(t.revenue_uah||0),0), revPrev: prev.reduce((s,t)=>s+Number(t.revenue_uah||0),0), txCount: curr.length };
}

function renderRFM(cs){
  const grid = {};
  cs.forEach(c => { const key = `${c.r_score}-${c.f_score}`; grid[key] = (grid[key]||0) + 1; });
  const cellHTML = (r, f) => {
    const cnt = grid[`${r}-${f}`] || 0;
    let color = '#94a3b8', lbl = '💀 Lost';
    if (r === 1 && f === 3) { color = '#39B44A'; lbl = '💎 Чемпіони'; }
    else if (r === 1 && f === 2) { color = '#39B44A'; lbl = '🟢 Лояльні'; }
    else if (r === 1 && f === 1) { color = '#3B82F6'; lbl = '🆕 Нові'; }
    else if (r === 2 && f === 3) { color = '#F59E0B'; lbl = '⚠ Втрачаємо'; }
    else if (r === 2 && f === 2) { color = '#F59E0B'; lbl = '🟡 At-risk'; }
    else if (r === 2 && f === 1) { color = '#F59E0B'; lbl = '😴 Засинають'; }
    else if (r === 3 && f === 3) { color = '#E84040'; lbl = '🚨 Чемпіони лост'; }
    else if (r === 3 && f === 2) { color = '#E84040'; lbl = '🔴 Лояльні лост'; }
    return `<div class="rfm-cell" style="background:${color}" onclick="filterByRF(${r},${f})"><div class="cnt">${cnt}</div><div class="lbl">${lbl}</div></div>`;
  };
  return `<div class="rfm-grid">
    <div class="rfm-col-lbl"></div><div class="rfm-col-lbl">F=1 (1-2)</div><div class="rfm-col-lbl">F=2 (3-9)</div><div class="rfm-col-lbl">F=3 (10+)</div>
    <div class="rfm-row-lbl">R=1 (≤30д)</div>${cellHTML(1,1)}${cellHTML(1,2)}${cellHTML(1,3)}
    <div class="rfm-row-lbl">R=2 (30-90д)</div>${cellHTML(2,1)}${cellHTML(2,2)}${cellHTML(2,3)}
    <div class="rfm-row-lbl">R=3 (>90д)</div>${cellHTML(3,1)}${cellHTML(3,2)}${cellHTML(3,3)}
  </div>`;
}
function filterByRF(r, f){
  const matches = state.data.customers.filter(c => c.r_score === r && c.f_score === f);
  if (matches.length === 0) return toast('Немає клієнтів у сегменті');
  if (matches.length === 1) return selectCustomer(matches[0].counterparty_ms_id);
  toast(`Сегмент R=${r} F=${f}: ${matches.length} клієнтів`);
}
async function selectCustomer(ms_id){
  const c = state.data.customers.find(x => x.counterparty_ms_id === ms_id);
  if (!c) return toast('Не знайдено', true);
  try {
    const [skus, timeline, dow, crm, cross] = await Promise.all([
      api(`v_customer_skus?counterparty_ms_id=eq.${ms_id}&select=*&order=revenue.desc`),
      api(`v_customer_timeline?counterparty_ms_id=eq.${ms_id}&select=*&order=date.desc&limit=300`),
      api(`v_customer_dow?counterparty_ms_id=eq.${ms_id}&select=*`),
      api(`crm_notes?counterparty_ms_id=eq.${ms_id}&select=*&order=note_date.desc`),
      api(`v_cross_sell?counterparty_ms_id=eq.${ms_id}&select=*&order=peer_revenue.desc&limit=10`),
    ]);
    state.customer = c; state.customerSkus = skus; state.customerTimeline = timeline; state.customerDow = dow; state.customerCrm = crm; state.crossSell = cross;
    renderDetail();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch(e){ toast('Помилка: ' + e.message, true); }
}

      <div class="cust-meta">
        <span>📋 ${c.company_type === 'individual' ? 'Фізособа' : c.company_type === 'entrepreneur' ? 'ФОП' : c.company_type === 'legal' ? 'Юр.особа' : '—'}</span>
        ${c.inn ? `<span>🧾 ${c.inn}</span>` : ''}
        <span>📍 <strong>${c.channel_name || '—'}</strong></span>
        ${c.price_type ? `<span>💰 ${c.price_type}</span>` : ''}
        ${c.state ? `<span>🏷 ${c.state}</span>` : ''}
      </div>
      <div class="cust-tags">
        <span class="cust-tag seg">${c.segment_label}</span>
        <span class="cust-tag">Health ${c.health_score}/100</span>
        <span class="cust-tag">Rank #${rank}/${all.length}</span>
        <span class="cust-tag">Частка ${sharePct.toFixed(2)}%</span>
      </div>
    </div>

    <!-- Health Hero -->
    <div class="health-hero">
      <div class="health-circle">${healthCircle(c.health_score)}<div class="val">${c.health_score}</div><div class="lbl">Health</div></div>
      <div class="health-info">
        <h3>${c.segment_label}</h3>
        <p style="margin:0;color:var(--muted);font-size:13px">Health = 40·Recency + 30·Frequency + 20·Growth + 10·Spend</p>
        <div class="components">
          <div class="health-comp">⏱ Recency: <strong>${c.days_since_last_order} дн.</strong></div>
          <div class="health-comp">🔁 Транзакцій: <strong>${c.tx_count}</strong></div>
          <div class="health-comp">📈 Growth 90д: <strong>${c.growth_90d_pct != null ? c.growth_90d_pct + '%' : '—'}</strong></div>
          <div class="health-comp">💰 Lifetime: <strong>${fmt.uahK(c.lifetime_revenue)}</strong></div>
          <div class="health-comp">🩺 vs peer: <strong>${avgHealth ? Math.round(c.health_score / avgHealth * 100) : '—'}%</strong></div>
        </div>
      </div>
    </div>

    <!-- KPI Strip 1 -->
    <div class="sec"><h2>📊 Основні метрики</h2></div>
    <div class="g4">
      <div class="kpi cy"><div class="lbl">💰 Lifetime</div><div class="val">${fmt.uah(c.lifetime_revenue)}</div><div class="sub">${c.tx_count} тр · ${c.lifetime_qty} шт</div></div>
      <div class="kpi cg"><div class="lbl">🛒 AOV</div><div class="val">${fmt.uah(c.aov)}</div><div class="sub">avg order value</div></div>
      <div class="kpi"><div class="lbl">📅 Перше замовлення</div><div class="val" style="font-size:16px">${fmt.date(c.first_order_date)}</div><div class="sub">${c.customer_lifetime_days} дн як клієнт</div></div>
      <div class="kpi"><div class="lbl">⏱ Останнє замовлення</div><div class="val" style="font-size:16px">${fmt.date(c.last_order_date)}</div><div class="sub">${ago(c.last_order_date)}</div></div>
    </div>
    <div class="g4" style="margin-top:14px">
      <div class="kpi cb"><div class="lbl">📊 Виручка 90д</div><div class="val">${fmt.uahK(c.revenue_90d)}</div><div class="sub">${c.tx_90d} тр</div></div>
      <div class="kpi ${c.growth_90d_pct > 0 ? 'cg' : c.growth_90d_pct < 0 ? 'cr' : ''}"><div class="lbl">📈 Growth 90д</div><div class="val">${c.growth_90d_pct != null ? c.growth_90d_pct + '%' : '—'}</div><div class="sub">vs попер. 90д</div></div>
      <div class="kpi"><div class="lbl">🔁 Cadence</div><div class="val">${c.avg_days_between_orders ? Math.round(c.avg_days_between_orders) + ' дн' : '—'}</div><div class="sub">avg між замовл.</div></div>
      <div class="kpi"><div class="lbl">🏷 Асортимент</div><div class="val">${c.skus_purchased}</div><div class="sub">унікальних SKU</div></div>
    </div>

    <!-- Auto-insights -->
    <div class="sec"><h2>🧠 Auto-insights · алгоритмічні підказки</h2></div>
    <div class="g3">${insights.map(i => `<div class="insight ${i.cls}"><h4>${i.icon} ${i.title}</h4><p>${i.body}</p></div>`).join('')}</div>

    <!-- Monthly trend -->
    <div class="sec"><h2>📈 Тренд по місяцях</h2></div>
    <div class="cc" style="margin-bottom:14px"><div class="chart-wrap tall"><canvas id="custTrendChart"></canvas></div></div>

    <!-- Top SKU + Peer comparison -->
    <div class="g2">
      <div class="cc">
        <div class="cc-head"><h3>🛒 ТОП SKU клієнта</h3><span class="pill">${skus.length}</span></div>
        <div class="tbl-scroll"><table class="dt">
          <thead><tr><th>#</th><th>SKU</th><th>Кат</th><th class="num">Шт</th><th class="num">Виручка</th><th class="num">Разів</th></tr></thead>
          <tbody>${skus.slice(0, 30).map((s,i) => `<tr><td>${i+1}</td><td title="${escapeHtml(s.sku_name)}">${truncate(s.sku_name, 28)}</td><td><small>${s.sku_category||'—'}</small></td><td class="num">${s.qty}</td><td class="num">${fmt.uah(s.revenue)}</td><td class="num">${s.times_ordered}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">Немає</td></tr>'}</tbody>
        </table></div>
      </div>
      <div class="cc">
        <div class="cc-head"><h3>📊 Порівняння з peer-клієнтом каналу</h3><span class="pill">${c.channel_name||'—'}</span></div>
        <div class="g1" style="gap:10px">
          <div class="kpi"><div class="lbl">💰 Lifetime vs peer</div><div class="val">${avgLifetime ? (c.lifetime_revenue / avgLifetime).toFixed(1) : '—'}×</div><div class="sub">peer: ${fmt.uahK(avgLifetime)}</div></div>
          <div class="kpi"><div class="lbl">🛒 AOV vs peer</div><div class="val">${avgAov ? (Number(c.aov) / avgAov).toFixed(1) : '—'}×</div><div class="sub">peer: ${fmt.uah(avgAov)}</div></div>
          <div class="kpi"><div class="lbl">🔁 Транзакції vs peer</div><div class="val">${avgTx ? (c.tx_count / avgTx).toFixed(1) : '—'}×</div><div class="sub">peer: ${avgTx.toFixed(0)}</div></div>
          <div class="kpi"><div class="lbl">🏆 Rank у каналі</div><div class="val">#${rank}</div><div class="sub">з ${all.length} клієнтів</div></div>
        </div>
      </div>
    </div>

    <!-- Cross-sell -->
    <div class="sec"><h2>🎯 Cross-sell · SKU що peers купляють, а цей клієнт ще ні</h2><span class="badge">${cross.length}</span></div>
    <div class="cc">${cross.length === 0 ? '<div class="empty">Усі SKU вже куплено або немає peers.</div>' : cross.slice(0, 10).map((x,i) => `
      <div class="cs-row">
        <div class="rk">${i+1}</div>
        <div class="nm">${escapeHtml(x.sku_name)}</div>
        <div><span class="cat">${x.sku_category||'—'}</span></div>
        <div class="val">${x.peer_buyers} клієнтів · ${fmt.uahK(x.peer_revenue)}</div>
      </div>
    `).join('')}</div>

    <!-- Day-of-week activity -->
    <div class="sec"><h2>📅 Активність по днях тижня</h2></div>
    <div class="cc"><div class="dow-grid">
      ${dowGrid.map(d => {
        if (d.cnt === 0) return `<div class="dow-cell empty"><div class="dow-name">${d.name}</div><div class="dow-cnt">·</div></div>`;
        const intensity = Math.min(0.95, 0.3 + (d.cnt / maxDow) * 0.7);
        return `<div class="dow-cell" style="background:rgba(0,17,84,${intensity})" title="${fmt.uah(d.rev)} · ${d.cnt} тр"><div class="dow-name">${d.name}</div><div class="dow-cnt">${d.cnt}</div></div>`;
      }).join('')}
    </div><div style="margin-top:10px;font-size:11px;color:var(--muted)">Інтенсивність = кількість замовлень. Найкращий день: ${dowGrid.sort((a,b)=>b.cnt-a.cnt)[0].name}</div></div>

    <!-- CRM Log -->
    <div class="sec"><h2>📝 CRM-лог · комунікації з клієнтом</h2>
      <button class="crm-add" onclick="openCrm('${c.counterparty_ms_id}', null)">+ Додати запис</button>
    </div>
    <div class="cc">${crm.length === 0
      ? '<div class="empty">Ще немає записів. Натисніть «+ Додати запис» щоб задокументувати дзвінок, email або зустріч.</div>'
      : crm.map(n => {
          const dueClass = n.next_date && new Date(n.next_date) <= new Date() ? ' due' : '';
          return `<div class="crm-row">
            <div class="crm-date">${fmt.date(n.note_date)}</div>
            <div class="crm-type">${n.note_type}</div>
            <div class="crm-text">${escapeHtml(n.summary)}${n.next_step ? `<strong>→ ${escapeHtml(n.next_step)}</strong>` : ''}</div>
            <div class="crm-next${dueClass}">${n.next_date ? '📅 ' + fmt.date(n.next_date) : ''}</div>
            <button class="crm-del" onclick="event.stopPropagation(); deleteCrm('${n.id}')" title="Видалити">✕</button>
          </div>`;
        }).join('')
    }</div>

    <!-- Timeline -->
    <div class="sec"><h2>📅 Timeline транзакцій</h2><span class="badge">${timeline.length}</span></div>
    <div class="cc">
      <div class="timeline">${timeline.length === 0 ? '<div class="empty">Немає</div>' : timeline.map(t => `<div class="tl-item"><div class="date">${fmt.date(t.date)}</div><div><div class="desc">${truncate(t.sku_name || '—', 50)}</div><div class="qty">${t.qty} шт · ${t.channel_name || '—'} ${t.note ? '· ' + truncate(t.note, 30) : ''}</div></div><div class="val">${fmt.uah(t.revenue_uah)}</div></div>`).join('')}</div>
    </div>

    <!-- AR aging placeholder -->
    <div class="sec"><h2>🔴 Прострочена дебіторка (ПДЗ)</h2></div>
    <div class="cc"><div class="placeholder">💼 Потребує синхронізації payments з МойСкладу (endpoint /entity/paymentin). У наступній ітерації.</div></div>

    <!-- Recommended actions -->
    <div class="sec"><h2>🎯 Рекомендовані дії</h2></div>
    <div class="cc"><div style="font-size:13px;color:#444;line-height:1.8">
      ${c.days_since_last_order > 60 ? `<div>📞 <strong>Подзвонити:</strong> не замовляли ${c.days_since_last_order} днів.</div>` : ''}
      ${c.growth_90d_pct < -20 ? `<div>🔍 <strong>З'ясувати причину падіння:</strong> -${Math.abs(c.growth_90d_pct)}% за 90д.</div>` : ''}
      ${c.skus_purchased < 5 && c.lifetime_revenue > 20000 ? `<div>🎯 <strong>Cross-sell:</strong> купує лише ${c.skus_purchased} SKU при lifetime ${fmt.uahK(c.lifetime_revenue)}.</div>` : ''}
      ${c.segment_label.includes('VIP') ? `<div>💎 <strong>Утримати:</strong> VIP клієнт.</div>` : ''}
      ${c.tx_count === 1 ? `<div>🆕 <strong>Welcome call:</strong> перше замовлення.</div>` : ''}
      ${cross.length >= 3 ? `<div>🛒 <strong>Cross-sell pitch:</strong> ${cross.length} SKU peers купляють — дивись секцію вище.</div>` : ''}
      ${insights.filter(i => i.cls === 'green').length > 0 && insights.filter(i => i.cls === 'red').length === 0 ? `<div>✓ <strong>Усе добре</strong> — клієнт у здоровому стані.</div>` : ''}
    </div></div>

    <!-- Customer card (raw) -->
    <div class="sec"><h2>📝 Картка контрагента (МойСклад)</h2></div>
    <div class="cc"><table class="dt" style="font-size:12px">
      <tr><th>Поле</th><th>Значення</th></tr>
      <tr><td><strong>МС ID</strong></td><td><code style="font-size:11px">${c.counterparty_ms_id}</code></td></tr>
      <tr><td><strong>Назва</strong></td><td>${escapeHtml(c.name)}</td></tr>
      <tr><td><strong>ЄДРПОУ / ІНН</strong></td><td>${c.inn || '—'}</td></tr>
      <tr><td><strong>Тип</strong></td><td>${c.company_type || '—'}</td></tr>
      <tr><td><strong>Тип цін</strong></td><td>${c.price_type || '—'}</td></tr>
      <tr><td><strong>Стан CRM</strong></td><td>${c.state || '—'}</td></tr>
      <tr><td><strong>Канал</strong></td><td>${c.channel_name || '—'} <small style="color:var(--muted)">(${c.channel_id})</small></td></tr>
      <tr><td><strong>Перше / Останнє</strong></td><td>${fmt.date(c.first_order_date)} → ${fmt.date(c.last_order_date)}</td></tr>
    </table></div>
  `;

  setTimeout(() => {
    const ctx = $('custTrendChart');
    if (ctx) {
      if (state.charts.custTrend) state.charts.custTrend.destroy();
      state.charts.custTrend = new Chart(ctx, {
        type: 'bar',
        data: { labels: months.map(m => { const [y,mo]=m.split('-'); return new Date(parseInt(y),parseInt(mo)-1,1).toLocaleDateString('uk-UA',{month:'short',year:'2-digit'}); }), datasets: [{ label: 'Виручка ₴', data: months.map(m => byMonth[m]), backgroundColor: '#001154', borderRadius: 4 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { ticks: { callback: (v) => fmt.uahK(v) } } } },
      });
    }
  }, 50);
}
function healthCircle(score){
  const r = 48, cx = 60, cy = 60, circ = 2 * Math.PI * r;
  const offset = circ * (1 - (score||0) / 100);
  const color = score >= 70 ? '#39B44A' : score >= 40 ? '#F59E0B' : '#E84040';
  return `<svg width="120" height="120" viewBox="0 0 120 120"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#EEE" stroke-width="8"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-dasharray="${circ}" stroke-dashoffset="${offset}" stroke-linecap="round" /></svg>`;
}
// CRM CRUD
function openCrm(custMsId, noteId){
  $('crmModal').classList.add('open');
  $('crmEditId').value = noteId || '';
  if (noteId) {
    const n = state.customerCrm.find(x => x.id === noteId);
    if (n) { $('crmDate').value = n.note_date; $('crmType').value = n.note_type; $('crmSummary').value = n.summary; $('crmNextStep').value = n.next_step||''; $('crmNextDate').value = n.next_date||''; }
  } else {
    $('crmDate').value = new Date().toISOString().slice(0,10);
    $('crmType').value = '📞 Дзвінок';
    $('crmSummary').value = ''; $('crmNextStep').value = ''; $('crmNextDate').value = '';
  }
}
function closeCrm(){ $('crmModal').classList.remove('open'); }
async function saveCrm(){
  const summary = $('crmSummary').value.trim();
  if (!summary) return toast('Заповніть «Про що»', true);
  const payload = {
    counterparty_ms_id: state.customer.counterparty_ms_id,
    note_date: $('crmDate').value,
    note_type: $('crmType').value,
    summary,
    next_step: $('crmNextStep').value || null,
    next_date: $('crmNextDate').value || null,
  };
  const editId = $('crmEditId').value;
  try {
    if (editId) await api(`crm_notes?id=eq.${editId}`, { method: 'PATCH', body: JSON.stringify(payload) });
    else await api('crm_notes', { method: 'POST', body: JSON.stringify(payload) });
    toast('✓ Збережено');
    closeCrm();
    // reload customer
    selectCustomer(state.customer.counterparty_ms_id);
  } catch(e){ toast('Помилка: ' + e.message, true); }
}
async function deleteCrm(id){
  if (!confirm('Видалити запис?')) return;
  try { await api(`crm_notes?id=eq.${id}`, { method: 'DELETE' }); toast('✓ Видалено'); selectCustomer(state.customer.counterparty_ms_id); }
  catch(e){ toast('Помилка: ' + e.message, true); }
}
// Search
$('searchInput').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase().trim();
  if (!q || q.length < 2) { $('autocomplete').className = 'autocomplete'; return; }
  const matches = state.data.customers.filter(c => (c.name||'').toLowerCase().includes(q) || (c.inn||'').includes(q)).slice(0, 20);
  $('autocomplete').innerHTML = matches.length === 0 ? '<div class="ac-item"><div class="name">Не знайдено</div></div>' : matches.map(c => `<div class="ac-item" onclick="selectCustomer('${c.counterparty_ms_id}')"><div class="name">${escapeHtml(c.name)}</div><span class="ch">${c.channel_name||'—'}</span><small style="color:var(--muted)">${fmt.uahK(c.lifetime_revenue)}</small></div>`).join('');
  $('autocomplete').className = 'autocomplete show';
});
document.addEventListener('click', (e) => { if (!e.target.closest('.search')) $('autocomplete').className = 'autocomplete'; });
$('backBtn').addEventListener('click', renderOverview);
window.selectCustomer = selectCustomer; window.filterByRF = filterByRF; window.renderOverview = renderOverview;
window.openCrm = openCrm; window.closeCrm = closeCrm; window.saveCrm = saveCrm; window.deleteCrm = deleteCrm;
window.setPeriod = setPeriod;
loadAll();
</script>
</body>
