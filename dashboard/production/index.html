<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Production · Barpi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/bb.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--y:#001154;--y-soft:rgba(0,17,84,.13);--g:#39B44A;--g-soft:rgba(57,180,74,.13);--r:#E84040;--r-soft:rgba(232,64,64,.1);--bl:#3B82F6;--or:#F59E0B;--vi:#8B5CF6;--d:#1A1A1A;--bg:#FAF7F7;--card:#fff;--muted:#888;--border:#E5E5DC;--line:#EEE}
body{background:var(--bg);font-family:Rubik,-apple-system,sans-serif;color:var(--d);margin:0}
.pr-top{position:sticky;top:0;z-index:200;background:var(--d);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px;border-bottom:3px solid var(--y)}
.pr-top h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
.pr-top .sub{font-size:11px;opacity:.6;font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.pr-top .spacer{flex:1}
.pr-top .sync{font-size:12px;opacity:.7;display:flex;align-items:center;gap:6px}
.pr-top .dot{width:8px;height:8px;border-radius:50%;background:var(--g)}
.pr-filters{position:sticky;top:48px;z-index:180;background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pr-filters label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.chip{font-family:Rubik;font-size:12px;font-weight:600;padding:7px 14px;border-radius:99px;border:1px solid var(--border);background:#fff;cursor:pointer;color:var(--d);transition:all .15s}
.chip:hover{border-color:var(--y);color:var(--y)}
.chip.on{background:var(--y);color:#fff;border-color:var(--y)}
.chip.refresh{background:transparent;color:var(--muted);border:none}
.pr-wrap{max-width:1440px;margin:0 auto;padding:20px 24px 40px}
.sec{margin:24px 0 12px;display:flex;align-items:center;gap:10px}
.sec h2{margin:0;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sec .badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--y-soft);color:var(--y)}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.g2,.g3,.g4{grid-template-columns:1fr}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;transition:all .2s}
.kpi:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,17,84,.06)}
.kpi .lbl{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.kpi .val{font-size:22px;font-weight:800;color:var(--d);letter-spacing:-.02em;line-height:1.1}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:6px}
.kpi.cy{border-bottom:3px solid var(--y)}.kpi.cg{border-bottom:3px solid var(--g)}.kpi.cr{border-bottom:3px solid var(--r)}.kpi.cb{border-bottom:3px solid var(--bl)}.kpi.co{border-bottom:3px solid var(--or)}.kpi.cv{border-bottom:3px solid var(--vi)}
.kpi.dim{opacity:.55}
.kpi.dim .val{color:var(--muted)}
.cc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.cc-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cc-head h3{margin:0;font-size:14px;font-weight:700;color:var(--d)}
.cc-head .pill{font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--y-soft);color:var(--y);text-transform:uppercase}
.chart-wrap{position:relative;height:280px}
.chart-wrap.tall{height:340px}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt th{text-align:left;padding:8px 12px;font-weight:700;font-size:10px;text-transform:uppercase;color:var(--muted);background:#FAFAF5;border-bottom:1px solid var(--line);letter-spacing:.05em}
table.dt td{padding:9px 12px;border-bottom:1px solid #F4F4F0;color:var(--d)}
table.dt td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.tbl-scroll{max-height:480px;overflow:auto;border-radius:8px;border:1px solid var(--line)}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px}
.tag.tg{background:var(--g-soft);color:var(--g)}.tag.tr{background:var(--r-soft);color:var(--r)}.tag.ty{background:var(--y-soft);color:var(--y)}
.loading{text-align:center;padding:60px;color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:13px}
.spinner{display:inline-block;width:30px;height:30px;border:3px solid var(--y-soft);border-top-color:var(--y);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bar-row{display:grid;grid-template-columns:1fr 80px;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
.bar-row:last-child{border-bottom:none}
.bar-row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .tk{height:6px;background:#F4F4F0;border-radius:99px;overflow:hidden;margin-top:4px}
.bar-row .fl{height:100%;border-radius:99px;background:linear-gradient(90deg,#001154,#3B82F6);transition:width .4s}
.bar-row .vl{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:12px;color:var(--y)}
</style>
</head>
<body>
<header class="pr-top">
  <h1>🏭 Barpi · <span class="sub">Production v3 — real COGS from supply positions</span></h1>
  <span class="spacer"></span>
  <span class="sync"><span class="dot"></span><span id="syncLabel">Завантаження…</span></span>
</header>
<div class="pr-filters">
  <label>⚡ Період:</label>
  <button class="chip" data-period="30">30 днів</button>
  <button class="chip" data-period="90">90 днів</button>
  <button class="chip on" data-period="180">180 днів</button>
  <button class="chip" data-period="365">1 рік</button>
  <button class="chip" data-period="all">Усе</button>
  <span style="flex:1"></span>
  <button class="chip refresh" id="reloadBtn">⟳ Оновити</button>
</div>
<div class="pr-wrap">
  <div id="loadingBox" class="loading"><div class="spinner"></div><p>Завантаження…</p></div>
  <div id="contentBox" style="display:none"></div>
</div>
<script src="../../assets/bb.js"></script>
<script>
const API='https://barpi-api.vg-ab6.workers.dev';
const $=(id)=>document.getElementById(id);
const $$=(s)=>document.querySelectorAll(s);
const fmt={
  uah:(n)=>n==null?'—':new Intl.NumberFormat('uk-UA').format(Math.round(n||0))+' ₴',
  uahK:(n)=>n==null?'—':n>=1e6?(n/1e6).toFixed(1)+'M ₴':n>=1e3?(n/1e3).toFixed(0)+'K ₴':Math.round(n||0)+' ₴',
  num:(n)=>new Intl.NumberFormat('uk-UA').format(n||0),
  date:(s)=>{if(!s)return '—';const d=new Date(s);return d.toLocaleDateString('uk-UA',{day:'2-digit',month:'2-digit',year:'2-digit'});},
  month:(s)=>{const d=new Date(s);return d.toLocaleDateString('uk-UA',{month:'short',year:'2-digit'});}
};
function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function truncate(s,n){return (s||'').length>n?s.slice(0,n)+'…':s;}
async function api(p){const r=await fetch(API+'/'+p,{headers:{'Content-Type':'application/json'}});if(!r.ok){if(r.status===404)return [];throw new Error('API '+r.status);}return r.json();}

let state={period:'180', charts:{}, data:{}};

async function loadAll(){
  try{
    $('syncLabel').textContent='Завантаження…';
    $('loadingBox').style.display='block';$('contentBox').style.display='none';
    const [plans,acts,eff,monthly,losses,sync]=await Promise.all([
      api('moysklad_processing_plans?select=ms_id,ms_name&order=ms_name&limit=200'),
      api('moysklad_processing_acts?select=ms_id,moment,plan_ms_id,materials_sum_uah,store_ms_id,products_qty&order=moment.desc&limit=3000'),
      api('v_production_efficiency?select=*&order=total_materials_uah.desc&limit=100'),
      api('v_production_monthly?select=*&order=month'),
      api('v_losses_monthly?select=*&order=month'),
      api('sync_state?entity=eq.processing&select=last_synced_at&limit=1'),
    ]);
    state.data={plans,acts,eff,monthly,losses};
    if(sync[0]&&sync[0].last_synced_at){
      const h=Math.floor((Date.now()-new Date(sync[0].last_synced_at).getTime())/3600000);
      $('syncLabel').textContent=`Sync ${h}h тому · ${acts.length} актів · ${plans.length} тех.карт`;
    }else{
      $('syncLabel').textContent=`${acts.length} актів · ${plans.length} тех.карт · D1`;
    }
    $('loadingBox').style.display='none';$('contentBox').style.display='block';
    render();
  }catch(e){console.error(e);$('syncLabel').textContent='Помилка: '+e.message;}
}

function filterByPeriod(rows, dateField='moment'){
  if (state.period==='all') return rows;
  const days=Number(state.period);
  const cutoff=new Date(Date.now()-days*86400000);
  return rows.filter(r => r[dateField] && new Date(r[dateField]) >= cutoff);
}
function filterMonths(rows){
  if (state.period==='all') return rows;
  const days=Number(state.period);
  const cutoff=new Date(Date.now()-days*86400000).toISOString().slice(0,7);
  return rows.filter(r => r.month >= cutoff);
}

function render(){
  const {plans, acts: allActs, eff: allEff, monthly: allMonthly, losses: allLosses} = state.data;
  const acts = filterByPeriod(allActs);
  const monthly = filterMonths(allMonthly);
  const losses = filterMonths(allLosses);

  const periodLabel = state.period === 'all' ? 'весь час' : `останні ${state.period} днів`;
  const planNameMap = {};
  plans.forEach(p => { planNameMap[p.ms_id] = p.ms_name; });

  // Plan stats for period (тепер з materials cost!)
  const byPlan = {};
  acts.forEach(a => {
    if (!a.plan_ms_id) return;
    if (!byPlan[a.plan_ms_id]) byPlan[a.plan_ms_id] = {runs:0, qty:0, cost:0, name:planNameMap[a.plan_ms_id]||'—'};
    byPlan[a.plan_ms_id].runs += 1;
    byPlan[a.plan_ms_id].qty += Number(a.products_qty||0);
    byPlan[a.plan_ms_id].cost += Number(a.materials_sum_uah||0);
  });
  const planRows = Object.entries(byPlan).map(([id,v])=>({plan_ms_id:id,...v})).sort((a,b)=>b.cost-a.cost);

  // KPIs
  const totalActs = acts.length;
  const totalQty = acts.reduce((s,a)=>s+Number(a.products_qty||0),0);
  const totalCost = acts.reduce((s,a)=>s+Number(a.materials_sum_uah||0),0);
  const uniquePlansUsed = Object.keys(byPlan).length;
  const lastAct = acts[0];
  const totalLossCount = losses.reduce((s,l)=>s+Number(l.losses_count||0),0);
  const totalLossQty = losses.reduce((s,l)=>s+Number(l.qty_lost||0),0);
  const avgCostPerKg = totalQty > 0 ? totalCost / totalQty : 0;

  $('contentBox').innerHTML = `
    <div class="sec"><h2>🏭 KPI виробництва · ${periodLabel}</h2></div>
    <div class="g4">
      <div class="kpi cy"><div class="lbl">📋 Тех.карт (lifetime)</div><div class="val">${plans.length}</div><div class="sub">${uniquePlansUsed} активних у періоді</div></div>
      <div class="kpi cb"><div class="lbl">🔧 Виробничих актів</div><div class="val">${fmt.num(totalActs)}</div><div class="sub">${lastAct?'last '+fmt.date(lastAct.moment):'—'}</div></div>
      <div class="kpi cg"><div class="lbl">📦 Виготовлено шт</div><div class="val">${fmt.num(totalQty)}</div><div class="sub">сума products_qty</div></div>
      <div class="kpi cr"><div class="lbl">⚠ Списань у періоді</div><div class="val">${fmt.num(totalLossCount)}</div><div class="sub">${fmt.num(totalLossQty)} шт</div></div>
    </div>

    <div class="sec"><h2>💰 COGS — собівартість матеріалів · ${periodLabel}</h2></div>
    <div class="g3">
      <div class="kpi co"><div class="lbl">💵 Materials cost</div><div class="val">${fmt.uahK(totalCost)}</div><div class="sub">сума по processing acts</div></div>
      <div class="kpi cv"><div class="lbl">📊 Avg cost / шт</div><div class="val">${fmt.uah(avgCostPerKg)}</div><div class="sub">cost ÷ виготовлено</div></div>
      <div class="kpi"><div class="lbl">🔬 Метод</div><div class="val" style="font-size:13px">positions × buy_price</div><div class="sub">з v_product_avg_cost</div></div>
    </div>

    <div class="sec"><h2>📈 Активність виробництва по місяцях · ${periodLabel}</h2></div>
    <div class="cc"><div class="chart-wrap tall"><canvas id="monthChart"></canvas></div></div>

    <div class="g2" style="margin-top:14px">
      <div class="cc">
        <div class="cc-head"><h3>🏆 ТОП тех.карт за вартістю · ${periodLabel}</h3><span class="pill">${planRows.length}</span></div>
        <div style="max-height:460px;overflow:auto">
          ${planRows.length ? planRows.slice(0,30).map((p,i)=>{const w=planRows[0].cost>0?(p.cost/planRows[0].cost*100):0;return `<div class="bar-row"><div><div class="nm">${i+1}. ${escapeHtml(truncate(p.name||'—',45))}</div><div class="tk"><div class="fl" style="width:${w}%"></div></div><div style="font-size:10px;color:#999;margin-top:2px">${p.runs} запусків · ${p.qty.toFixed(0)} шт</div></div><div class="vl">${fmt.uahK(p.cost)}<small style="font-size:9px;color:#888;display:block;font-weight:500">COGS</small></div></div>`;}).join('') : '<div class="empty">Немає виробничих актів за період</div>'}
        </div>
      </div>
      <div class="cc">
        <div class="cc-head"><h3>📋 Останні 50 виробничих актів</h3><span class="pill">${acts.length}</span></div>
        <div class="tbl-scroll" style="max-height:460px"><table class="dt">
          <thead><tr><th>Дата</th><th>Тех.карта</th><th class="num">Шт</th><th class="num">Cost ₴</th></tr></thead>
          <tbody>${acts.slice(0,50).map(a=>`<tr><td>${fmt.date(a.moment)}</td><td><small>${escapeHtml(truncate(planNameMap[a.plan_ms_id]||'—',40))}</small></td><td class="num">${Number(a.products_qty||0).toFixed(0)}</td><td class="num">${fmt.uah(a.materials_sum_uah)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Немає актів за період</td></tr>'}</tbody>
        </table></div>
      </div>
    </div>

    <div class="sec"><h2>⚠ Списання по місяцях · ${periodLabel}</h2></div>
    <div class="cc"><div class="chart-wrap"><canvas id="lossChart"></canvas></div></div>

    <div class="sec"><h2>📊 Lifetime efficiency (v_production_efficiency)</h2></div>
    <div class="cc"><div class="tbl-scroll"><table class="dt">
      <thead><tr><th>#</th><th>Тех.карта</th><th class="num">Lifetime запусків</th><th class="num">Materials ₴</th><th class="num">Шт виготовлено</th></tr></thead>
      <tbody>${allEff.slice(0,50).map((e,i)=>`<tr><td>${i+1}</td><td><strong>${escapeHtml(truncate(e.plan_name||'—',55))}</strong></td><td class="num">${e.production_runs}</td><td class="num">${fmt.uahK(e.total_materials_uah)}</td><td class="num">${e.total_products_qty?Number(e.total_products_qty).toFixed(0):'—'}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Немає</td></tr>'}</tbody>
    </table></div></div>
  `;

  setTimeout(()=>{
    if(state.charts.month)state.charts.month.destroy();
    state.charts.month=new Chart($('monthChart'),{
      type:'bar',
      data:{labels:monthly.map(m=>fmt.month(m.month)),datasets:[
        {label:'🔧 Актів виробництва',data:monthly.map(m=>Number(m.acts||0)),backgroundColor:'#3B82F6',borderRadius:4,yAxisID:'y'},
        {label:'📦 Шт виготовлено',data:monthly.map(m=>Number(m.products_made||0)),backgroundColor:'#39B44A',borderRadius:4,yAxisID:'y'},
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{y:{position:'left',title:{display:true,text:'Кількість'}}}}
    });
    if(state.charts.loss)state.charts.loss.destroy();
    state.charts.loss=new Chart($('lossChart'),{
      type:'bar',
      data:{labels:losses.map(l=>fmt.month(l.month)),datasets:[
        {label:'Списань (кількість)',data:losses.map(l=>Number(l.losses_count||0)),backgroundColor:'#E84040',borderRadius:4,yAxisID:'y'},
        {label:'Шт списано',data:losses.map(l=>Number(l.qty_lost||0)),type:'line',borderColor:'#F59E0B',backgroundColor:'transparent',borderWidth:2.5,tension:.3,pointRadius:3,yAxisID:'y1'},
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{y:{position:'left',title:{display:true,text:'Списань'}},y1:{position:'right',title:{display:true,text:'Шт'},grid:{drawOnChartArea:false}}}}
    });
  },50);
}

$$('.chip[data-period]').forEach(b=>b.addEventListener('click',()=>{
  $$('.chip[data-period]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  state.period=b.dataset.period;
  render();
}));
$('reloadBtn').addEventListener('click',loadAll);
loadAll();
</script>
</body>
</html>
