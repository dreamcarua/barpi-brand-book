<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Розіграші · Barpi</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<!--
  Barpi · Розіграші в Instagram (рішення Вадима 27.11.2026). v1.0.0
  Сторінка без даних і без секретів (репозиторій публічний): усе з воркера barpi-giveaways (/dashboard/api/giveaways/*).
  Вхід дає Cloudflare Access (/dashboard/*), воркер ще раз перевіряє JWT.
  Жеребкування робить сервер; анімація презентації лише показує вже записаний результат.
  Інтерфейс українською (внутрішній інструмент); картка в /dashboard/ і публічний протокол /giveaway/ двомовні.
-->
<style>
:root{--navy:#001154;--blue:#BAD9F4;--sky:#EEF4FC;--paper:#F5F8FC;--ink:#0B1433;--muted:#475467;--line:#DFE6F1;--red:#b3261e;--amber:#b26a00;--green:#1f7a35;--r:14px;
  --ease-out:cubic-bezier(0.23,1,0.32,1);--ease-in-out:cubic-bezier(0.77,0,0.175,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Rubik,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.5}
a{color:var(--navy)}
[hidden]{display:none!important}
.top{background:var(--navy);color:#fff}
.top .in{max-width:1280px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top .sub{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:600}
.top .ttl{font-weight:800;font-size:18px}
.top .sp{flex:1}
.top a{color:#fff;opacity:.85;font-size:13px;text-decoration:none}
main{max-width:1280px;margin:0 auto;padding:24px}
h1{font-size:30px;font-weight:800;color:var(--navy);line-height:1.15}
h2{font-size:19px;font-weight:800;color:var(--navy);margin-bottom:10px}
.lead{color:var(--muted);margin:4px 0 18px;max-width:820px}
.head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:6px}
.head .sp{flex:1}
.btn{border:0;border-radius:99px;padding:10px 18px;font:700 14px Rubik;cursor:pointer;background:var(--navy);color:#fff;transition:transform 160ms var(--ease-out),opacity 160ms ease;min-height:42px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--navy)}
.btn.soft{background:var(--sky);color:var(--navy)}
.btn.danger{background:#fff;color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
.btn.sm{padding:6px 12px;min-height:32px;font-size:13px}
.btn.big{font-size:20px;font-weight:900;letter-spacing:.04em;padding:22px 40px;border-radius:22px;width:100%;justify-content:center;box-shadow:0 18px 40px -22px rgba(0,17,84,.8)}
.banner{border-radius:var(--r);padding:12px 16px;margin-bottom:16px;background:#fff7e6;border:1px solid #f0d49a;color:#6b4300;font-size:14px}
.banner.bad{background:#fff6f5;border-color:#f3c1bd;color:#7a1a14}
.banner.ok{background:#eef8f0;border-color:#bfe3c8;color:#17592a}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi b{display:block;font-size:28px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.warn{border-color:#f0d49a;background:#fffaf0}.kpi.warn b{color:var(--amber)}
.ship{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.ship select,.ship input{width:auto;margin:0;min-height:36px;padding:6px 10px}.ship .sh-ttn{width:170px}.ship .sh-note{flex:1;min-width:180px}
.banner.soft{background:var(--sky);border-color:var(--line);color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;font:600 14px Rubik;color:var(--navy);cursor:pointer;min-height:40px}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tabs button i{font-style:normal;opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}
.cards{display:grid;gap:10px}
.gcard{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;cursor:pointer;text-decoration:none;color:inherit;transition:box-shadow 200ms ease,transform 200ms var(--ease-out)}
@media (hover:hover) and (pointer:fine){.gcard:hover{box-shadow:0 12px 26px -20px rgba(0,17,84,.6);transform:translateY(-1px)}}
.thumb{width:72px;height:72px;border-radius:10px;background:var(--sky) center/cover no-repeat;display:grid;place-items:center;color:var(--navy);font-weight:800;font-size:11px;letter-spacing:.08em;overflow:hidden}
.thumb{position:relative}.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gcard .t{font-weight:700;font-size:16px;color:var(--navy)}
.gcard .m{font-size:13px;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:3px}
.gcard .m b{color:var(--ink);font-variant-numeric:tabular-nums}
.chip{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:600;background:var(--sky);color:var(--navy);white-space:nowrap}
.chip.test{background:#fff3dc;color:var(--amber)}.chip.ok{background:#e3f4e7;color:var(--green)}.chip.bad{background:#fde8e6;color:var(--red)}.chip.warn{background:#fff3dc;color:var(--amber)}.chip.navy{background:var(--navy);color:#fff}
.empty{background:#fff;border:1px dashed var(--line);border-radius:var(--r);padding:32px;text-align:center;color:var(--muted)}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px 18px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--navy)}
label.f small{display:block;font-weight:400;color:var(--muted);margin-top:2px}
input[type=text],input[type=number],input[type=datetime-local],input[type=search],textarea,select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:#fff;color:var(--ink);margin-top:5px;min-height:42px}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--navy);flex:none}
.check b{display:block;color:var(--navy)}.check span{font-size:13px;color:var(--muted)}
.check.on{border-color:var(--navy);background:#fafcff}
.sub-f{margin:8px 0 0 30px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.small{font-size:12.5px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;word-break:break-all}
.steps{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.steps button{flex:1;min-width:150px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font:600 14px Rubik;color:var(--navy);cursor:pointer;text-align:left;min-height:54px}
.steps button small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.steps button.on{background:var(--navy);color:#fff;border-color:var(--navy)}.steps button.on small{color:var(--blue)}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.mi{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;cursor:pointer;text-align:left;padding:0;font:inherit}
.mi.on{border-color:var(--navy);box-shadow:0 0 0 3px var(--blue)}
.mi .ph{aspect-ratio:1;background:var(--sky);display:grid;place-items:center;color:var(--navy);font-size:12px;font-weight:700}
.mi .ph{position:relative}.mi .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.mi .cp{padding:8px 10px;font-size:12px;color:var(--muted);height:62px;overflow:hidden}
.mi .cp b{display:block;color:var(--ink);font-size:12px}
table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
th{background:var(--sky);color:var(--navy);font-weight:700;font-size:12.5px}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;font-weight:700;color:var(--navy);white-space:nowrap}
td .cm{max-width:520px;overflow-wrap:anywhere}
.acts{display:flex;gap:4px;white-space:nowrap}
.acts button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:15px;font-weight:700;color:var(--muted)}
.acts button.y.on{background:#e3f4e7;border-color:var(--green);color:var(--green)}
.acts button.n.on{background:#fde8e6;border-color:var(--red);color:var(--red)}
.acts button.q.on{background:#fff3dc;border-color:var(--amber);color:var(--amber)}
.tablewrap{overflow-x:auto}
.winner{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;background:#fff}
.winner .pos{width:46px;height:46px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
.winner.reserve .pos{background:var(--sky);color:var(--navy)}
.winner.failed{opacity:.6}.winner.failed .nm{text-decoration:line-through}
.winner .nm{font-weight:800;font-size:18px;color:var(--navy);overflow-wrap:anywhere}
.reason{display:flex;gap:8px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:24px;background:var(--navy);color:#fff;border-radius:12px;padding:12px 18px;font-weight:600;z-index:90;box-shadow:0 18px 40px -18px rgba(0,17,84,.8);max-width:92vw;
  opacity:0;transform:translate(-50%,100%);transition:opacity 400ms ease,transform 400ms ease;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--red)}
.modal-bg{position:fixed;inset:0;background:rgba(11,20,51,.55);z-index:80;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:18px;padding:22px;max-width:480px;width:100%;animation:pop 250ms var(--ease-out)}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.kpi small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:0}
.grid2>.panel,.grid3>.panel{margin-bottom:0}.grid2,.grid3{margin-bottom:14px}
.prow{display:grid;grid-template-columns:1fr 210px auto;gap:8px;margin:6px 0;align-items:center}
.prow input,.prow select{margin:0}
.sortb{background:none;border:0;font:inherit;font-weight:700;color:var(--navy);cursor:pointer;padding:4px 2px;min-height:32px;white-space:nowrap}
.sortb span{opacity:.5;font-weight:400}th[aria-sort=ascending] .sortb span,th[aria-sort=descending] .sortb span{opacity:1}
mark{background:#fff0b8;color:inherit;border-radius:3px;padding:0 2px}
.dist .r{display:grid;grid-template-columns:110px 1fr 48px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.dist .t{height:10px;background:var(--sky);border-radius:99px;overflow:hidden}.dist .t i{display:block;height:100%;background:var(--navy);border-radius:99px}
.dist b{text-align:right;font-variant-numeric:tabular-nums;color:var(--navy)}
.lb{list-style:none;display:grid;gap:10px}.lb li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;font-size:14px}
.lb .rk{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}.lb .who{min-width:0}.lb .tx{font-size:12.5px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.lb .bar{height:6px;background:var(--sky);border-radius:99px;margin-top:5px;overflow:hidden}.lb .bar i{display:block;height:100%;background:var(--navy);border-radius:99px}
.lb li>b{font-variant-numeric:tabular-nums;color:var(--navy);white-space:nowrap}
.tl{display:flex;align-items:flex-end;gap:2px;height:170px;border-bottom:1px solid var(--line)}
.tl i{flex:1;min-width:1px;background:#8fb3e6;border-radius:3px 3px 0 0}.tl i.pk{background:var(--navy)}
.tlx{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.facts{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:8px 18px;font-size:14px}.facts dt{font-weight:700;color:var(--navy)}.facts dd{overflow-wrap:anywhere}
.phonewrap{display:grid;place-items:center;padding:6px 0 4px}
.phone{width:min(400px,100%);background:#0b1433;border-radius:36px;padding:10px;box-shadow:0 24px 50px -30px rgba(0,17,84,.7)}
.phone .scr{color:#0B1433;background:#fff;border-radius:28px;overflow:hidden;height:min(720px,78vh);display:flex;flex-direction:column}
.ighd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #eee;font-size:14px}.ighd .sp{flex:1}
.phone .a{width:32px;height:32px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.igtabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #eee}
.igtabs button{background:none;border:0;border-bottom:2px solid transparent;padding:11px 6px;font:600 13px Rubik;color:#8a8f98;cursor:pointer;min-height:44px}
.igtabs button.on{color:#111;border-bottom-color:#111}
.igview{flex:1;overflow-y:auto;min-height:0}
.igpost{aspect-ratio:1;background:var(--sky);display:grid;place-items:center}.igpost img{width:100%;height:100%;object-fit:cover}.igpost .noimg{font-weight:800;color:var(--navy)}
.igcap{padding:12px 14px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.igsearch{padding:10px 12px;border-bottom:1px solid #f1f1f1;position:sticky;top:0;background:#fff;z-index:1}.igsearch input{margin:0}
.igc{display:grid;grid-template-columns:32px 1fr 28px;gap:10px;padding:10px 14px;font-size:14px}
.igc.rep{padding-left:46px}.igc.off{opacity:.45}
.igc .t{overflow-wrap:anywhere}.igc .m{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:#8a8f98;margin-top:3px}
.igc .m .no{background:var(--navy);color:#fff;border-radius:99px;padding:0 8px;font-weight:700}
.igc .h{font-size:12px;color:#8a8f98;text-align:center;line-height:1.3}
.ignote{padding:14px;font-size:12px;color:#8a8f98;text-align:center}
/* ── Режим ефіру ──────────────────────────────────────────────────────── */
#live{position:fixed;inset:0;z-index:100;color:#fff;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);overflow:hidden;
  background:radial-gradient(55% 48% at 50% 46%,#16369c 0%,#001154 46%,#00082e 100%)}
#live::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(186,217,244,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(186,217,244,.05) 1px,transparent 1px);background-size:120px 120px;pointer-events:none}
#live .fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
#live .lt,#live .body,#live .bottom{position:relative;z-index:2}
#live .lt{display:flex;justify-content:space-between;align-items:center;padding:18px 36px;gap:12px;flex-wrap:wrap}
#live .row{gap:12px}
#live .brand{font-weight:900;font-size:26px;letter-spacing:.26em}
#live .brand small{font-size:11px;letter-spacing:.3em;color:var(--blue);margin-left:6px;text-transform:uppercase;font-weight:500}
#live .pill{border:1px solid rgba(186,217,244,.3);border-radius:99px;padding:7px 14px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;display:inline-flex;gap:8px;align-items:center}
#live .pill i{width:8px;height:8px;border-radius:50%;background:var(--blue)}#live .pill.warn{color:#ffd58a;border-color:rgba(255,213,138,.45)}
#live .lb2{background:rgba(255,255,255,.07);border:1px solid rgba(186,217,244,.28);color:#fff;border-radius:10px;padding:10px 16px;font:600 13px Rubik;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;text-decoration:none;min-height:44px;display:inline-flex;align-items:center;transition:transform 160ms var(--ease-out)}
#live .lb2:active{transform:scale(.97)}#live .lb2[disabled]{opacity:.5;cursor:not-allowed}
#live .lb2.big{padding:16px 30px;font-size:15px;font-weight:800}
#live .lb2.primary,#live .lb2.on{background:var(--blue);color:var(--navy);border-color:var(--blue)}
#live .lb2.ok{border-color:#35c26b;color:#8ff0b3}#live .lb2.no{border-color:#e06a62;color:#ffaaa3}
#live .body{display:grid;grid-template-columns:minmax(230px,300px) 1fr minmax(230px,300px);gap:24px;padding:0 36px;min-height:0}
#live .body.phone-on{grid-template-columns:minmax(230px,300px) 1fr minmax(300px,380px)}
#live .phone-on .side.right{display:none}#live .phonewrap2{display:none;min-height:0}
#live .phone-on .phonewrap2{display:grid;place-items:center}
#live .phonewrap2 .phonewrap{padding:0;width:100%}
#live .phonewrap2 .phone{transform:perspective(1400px) rotateY(-11deg) rotateZ(1.5deg);box-shadow:-30px 40px 80px -30px rgba(0,0,0,.8)}
#live .phonewrap2 .phone .scr{height:min(640px,64vh)}
#live .igc.hit{background:#e3eefb;opacity:1;box-shadow:inset 3px 0 0 var(--navy)}
#live .side{display:flex;flex-direction:column;gap:12px;overflow:hidden;min-height:0}
#live .card{background:rgba(255,255,255,.05);border:1px solid rgba(186,217,244,.16);border-radius:14px;padding:16px 18px;animation:lvap 500ms var(--ease-out) both}
#live .side .card:nth-child(2){animation-delay:60ms}#live .side .card:nth-child(3){animation-delay:120ms}#live .side .card:nth-child(4){animation-delay:180ms}
#live .k{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(186,217,244,.85)}
#live .v{font-size:clamp(30px,3vw,44px);font-weight:900;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
#live .v.sm{font-size:clamp(18px,1.7vw,26px);overflow-wrap:anywhere}
#live .s{font-size:13px;color:rgba(255,255,255,.72);margin-top:6px}#live .s b{color:#fff}
#live .bars .r{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-top:8px;font-size:13px}
#live .bars .l{position:relative;isolation:isolate;padding:5px 8px;border-radius:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#live .bars .l i{position:absolute;inset:0 auto 0 0;width:calc(var(--w,0)*100%);background:rgba(186,217,244,.18);border-radius:6px;z-index:-1}
#live .bars .l.ok i{background:rgba(53,194,107,.3)}#live .bars .l.bad i{background:rgba(224,106,98,.28)}#live .bars .l.bad{text-decoration:line-through;opacity:.7}
#live .bars b{font-variant-numeric:tabular-nums;color:rgba(255,255,255,.8)}
#live .spark{display:flex;align-items:flex-end;gap:2px;height:56px;margin-top:10px}
#live .spark i{flex:1;background:rgba(186,217,244,.4);border-radius:2px}#live .spark i.pk{background:#fff}
#live .center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-width:0;gap:10px}
