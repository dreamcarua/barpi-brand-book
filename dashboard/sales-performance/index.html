<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sales Performance · Barpi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/bb.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--y:#001154;--y-soft:rgba(0,17,84,.13);--g:#39B44A;--g-soft:rgba(57,180,74,.13);--r:#E84040;--r-soft:rgba(232,64,64,.10);--bl:#3B82F6;--bl-soft:rgba(59,130,246,.10);--or:#F59E0B;--or-soft:rgba(245,158,11,.13);--d:#1A1A1A;--bg:#FAF7F7;--card:#fff;--muted:#888;--border:#E5E5DC;--line:#EEE}
body{background:var(--bg);font-family:Rubik,-apple-system,sans-serif;color:var(--d);margin:0}
.sp-topbar{position:sticky;top:0;z-index:200;background:var(--d);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px;border-bottom:3px solid var(--y)}
.sp-topbar h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
.sp-topbar .sub{font-size:11px;opacity:.6;font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.sp-topbar .spacer{flex:1}
.sp-topbar .sync{font-size:12px;opacity:.7;display:flex;align-items:center;gap:6px}
.sp-topbar .dot{width:8px;height:8px;border-radius:50%;background:var(--g)}
.tabnav{background:var(--d);padding:0 24px;display:flex;align-items:stretch;gap:0;border-bottom:2px solid rgba(255,255,255,.08);position:sticky;top:48px;z-index:180;overflow-x:auto}
.tab-btn{padding:0 18px;height:40px;background:transparent;border:none;border-bottom:3px solid transparent;color:rgba(255,255,255,.45);font-family:Rubik;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;letter-spacing:-.2px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab-btn:hover{color:rgba(255,255,255,.85)}
.tab-btn.on{color:#fff;border-bottom-color:var(--y)}
.sp-filters{position:sticky;top:88px;z-index:150;background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp-filters label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.chip{font-family:Rubik;font-size:12px;font-weight:600;padding:7px 14px;border-radius:99px;border:1px solid var(--border);background:#fff;cursor:pointer;color:var(--d);transition:all .15s}
.chip:hover{border-color:var(--y);color:var(--y)}
.chip.on{background:var(--y);color:#fff;border-color:var(--y)}
.chip.refresh{background:transparent;color:var(--muted);border:none}
.sp-wrap{max-width:1440px;margin:0 auto;padding:18px 24px 40px}
.sec{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sec h2{margin:0;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sec .badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--y-soft);color:var(--y)}
.g1{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.g2,.g3{grid-template-columns:1fr}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;transition:all .2s}
.kpi:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,17,84,.06)}
.kpi .lbl{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.kpi .val{font-size:22px;font-weight:800;color:var(--d);letter-spacing:-.02em;line-height:1.1}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:6px}
.kpi.cy{border-bottom:3px solid var(--y)}
.kpi.cg{border-bottom:3px solid var(--g)}
.kpi.cb{border-bottom:3px solid var(--bl)}
.kpi.dark{background:var(--d);color:#fff}
.kpi.dark .lbl,.kpi.dark .sub{color:rgba(255,255,255,.7)}
.kpi.dark .val{color:#fff}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:11px;padding:2px 7px;border-radius:99px}
.delta.up{background:var(--g-soft);color:var(--g)}
.delta.dn{background:var(--r-soft);color:var(--r)}
.delta.neu{background:#f3f3f3;color:#777}
.cc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.cc-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cc-head h3{margin:0;font-size:14px;font-weight:700;color:var(--d)}
.cc-head .pill{font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--y-soft);color:var(--y);text-transform:uppercase;letter-spacing:.04em}
.cc-head .spacer{flex:1}
.chart-wrap{position:relative;height:280px}
.chart-wrap.tall{height:340px}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt th{text-align:left;padding:8px 12px;font-weight:700;font-size:10px;text-transform:uppercase;color:var(--muted);background:#FAFAF5;border-bottom:1px solid var(--line);letter-spacing:.05em}
table.dt td{padding:8px 12px;border-bottom:1px solid #F4F4F0;color:var(--d)}
table.dt tbody tr:hover{background:#FBFAF5}
table.dt td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.tbl-scroll{max-height:380px;overflow:auto;border-radius:8px;border:1px solid var(--line)}
.heat-tbl{width:100%;border-collapse:separate;border-spacing:2px;font-size:11px}
.heat-tbl th{padding:6px 4px;text-align:center;font-weight:600;color:var(--muted);font-size:10px}
.heat-tbl th.lbl{text-align:left;padding-left:10px;background:#FAFAF5;position:sticky;left:0;width:140px}
.heat-tbl td.lbl{text-align:left;padding:6px 10px;background:#FAFAF5;font-weight:600;position:sticky;left:0;z-index:2;border-left:3px solid transparent}
.heat-tbl td{text-align:center;padding:6px 4px;border-radius:4px;font-weight:600;color:#fff;font-size:11px;min-width:48px}
.heat-tbl td.tot{background:#fff;color:var(--d);font-weight:700;font-size:12px;border:1px solid var(--line)}
.heat-tbl td.empty{background:#FBFBF8;color:#ccc;font-weight:400}
.alert{padding:12px 16px;border-radius:10px;margin-bottom:8px;display:flex;align-items:center;gap:10px;font-size:13px;border-left:4px solid}
.alert.red{background:#FEF2F2;border-color:var(--r);color:#7B1F1F}
.alert.blue{background:#EFF6FF;border-color:var(--bl);color:#1E3A8A}
.alert .icon{font-size:18px}
.alert .body{flex:1}
.alert strong{display:block;font-weight:700;font-size:13px}
.alert small{font-size:11px;opacity:.8}
.toast{position:fixed;bottom:24px;right:24px;background:var(--d);color:#fff;padding:14px 22px;border-radius:10px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;transform:translateY(8px);transition:all .25s;z-index:1000}
.toast.show{opacity:1;transform:translateY(0)}
.toast.err{background:var(--r)}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:13px}
.bars{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.br{display:grid;grid-template-columns:140px 1fr 140px;align-items:center;gap:10px;font-size:12px}
.br .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br .tk{height:8px;background:#F4F4F0;border-radius:99px;overflow:hidden}
.br .fl{height:100%;border-radius:99px;transition:width .4s}
.br .vl{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--y);display:flex;justify-content:flex-end;align-items:center;gap:4px}
.abc{display:inline-block;width:20px;height:20px;border-radius:5px;text-align:center;font-weight:800;font-size:10px;line-height:20px;color:#fff;margin-right:6px}
.abc-A{background:var(--g)}.abc-B{background:var(--or)}.abc-C{background:#94a3b8}
.loading{text-align:center;padding:60px;color:var(--muted)}
.loading .spinner{display:inline-block;width:30px;height:30px;border:3px solid var(--y-soft);border-top-color:var(--y);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media print{.sp-topbar,.tabnav,.sp-filters,.toast{display:none}.sp-wrap{max-width:none;padding:0}body{background:#fff}.cc{box-shadow:none;page-break-inside:avoid}}
</style>
</head>
<body>
<div id="bb-shell"></div>
<main class="bb-main" id="bb-main" style="padding:0">
<header class="sp-topbar">
  <h1>📈 Barpi · <span class="sub">Sales Performance</span></h1>
  <span class="spacer"></span>
  <span class="sync"><span class="dot"></span><span id="syncLabel">Завантаження…</span></span>
</header>
<nav class="tabnav">
  <button class="tab-btn on" data-tab="overview"><span>📊</span> Огляд</button>
  <button class="tab-btn" data-tab="dynamics"><span>📈</span> Динаміка</button>
  <button class="tab-btn" data-tab="products"><span>🏆</span> Продукти</button>
  <button class="tab-btn" data-tab="channels"><span>🏪</span> Канали</button>
</nav>
<div class="sp-filters">
  <label>⚡ Період:</label>
  <button class="chip" data-period="7">7 днів</button>
  <button class="chip on" data-period="30">30 днів</button>
  <button class="chip" data-period="90">90 днів</button>
  <button class="chip" data-period="180">180 днів</button>
  <button class="chip" data-period="365">1 рік</button>
  <button class="chip" data-period="all">Усе</button>
  <label style="margin-left:18px">📍 Канал:</label>
  <select id="channelFilter" class="chip" style="font-weight:600;padding:7px 14px;background:#fff;border:1px solid var(--border)">
    <option value="">Усі канали</option>
  </select>
  <span style="flex:1"></span>
  <button class="chip refresh" id="syncNowBtn" title="Запустити sync">⚡ Sync</button>
  <button class="chip refresh" id="reloadBtn">⟳ Оновити</button>
  <button class="chip" id="printBtn">🖨 Друк</button>
</div>
<div class="sp-wrap">
  <div id="loadingBox" class="loading"><div class="spinner"></div><p>Завантаження…</p></div>
  <div id="contentBox" style="display:none"></div>
</div>
</main>
<div id="toast" class="toast"></div>
<script src="../../assets/bb.js"></script>
<script>
const SUPA_URL = 'https://zrcqmwlpsggiqgipvxhv.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpyY3Ftd2xwc2dnaXFnaXB2eGh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MzcyMTYsImV4cCI6MjA5NTUxMzIxNn0.ROzbQ6aGRs-9rDVIDv0UyzlrvBRWFmFMQ7n77bLALmY';
const $ = (id) => document.getElementById(id);
const $$ = (sel) => document.querySelectorAll(sel);
const fmt = {
  uah: (n) => new Intl.NumberFormat('uk-UA').format(Math.round(n||0)) + ' ₴',
  uahK: (n) => n >= 1e6 ? (n/1e6).toFixed(1)+'M ₴' : n >= 1e3 ? (n/1e3).toFixed(0)+'K ₴' : Math.round(n)+' ₴',
  num: (n) => new Intl.NumberFormat('uk-UA').format(n||0),
  pct: (n) => (n||0).toFixed(1) + '%',
  date: (s) => { const d = new Date(s); return d.toLocaleDateString('uk-UA',{day:'2-digit',month:'2-digit'}); },
  month: (s) => { const [y, m] = s.split('-'); return new Date(parseInt(y), parseInt(m)-1, 1).toLocaleDateString('uk-UA',{month:'short',year:'2-digit'}); },
};
function deltaTag(pct){
  if (pct == null || !isFinite(pct)) return '<span class="delta neu">—</span>';
  const cls = pct > 0.5 ? 'up' : pct < -0.5 ? 'dn' : 'neu';
  const sign = pct > 0 ? '↑' : pct < 0 ? '↓' : '→';
  return `<span class="delta ${cls}">${sign} ${Math.abs(pct).toFixed(1)}%</span>`;
}
function toast(msg, isErr=false){
  const t = $('toast'); t.textContent = msg;
  t.className = 'toast show' + (isErr?' err':'');
  setTimeout(() => t.className = 'toast', 2800);
}
async function api(path){
  const r = await fetch(SUPA_URL + '/rest/v1/' + path, { headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY } });
  if(!r.ok) throw new Error('API ' + r.status);
  return r.json();
}
let state = { period: 30, channel: '', tab: 'overview', rows: [], channels: [], charts: {}, lastSync: null };
async function loadAll(){
  try {
    $('syncLabel').textContent = 'Завантаження…';
    $('loadingBox').style.display = 'block'; $('contentBox').style.display = 'none';
    const [rows1, rows2, rows3, channels, sync] = await Promise.all([
      api('sales_extended?select=date,channel_id,channel_name,channel_color,sku_id,sku_name,sku_category,format_g,quantity,revenue_uah,margin_uah,cost_calc,counterparty_ms_id&channel_id=neq.internal&order=date.desc&limit=10000'),
      api('sales_extended?select=date,channel_id,channel_name,channel_color,sku_id,sku_name,sku_category,format_g,quantity,revenue_uah,margin_uah,cost_calc,counterparty_ms_id&channel_id=neq.internal&order=date.desc&offset=10000&limit=10000'),
      api('sales_extended?select=date,channel_id,channel_name,channel_color,sku_id,sku_name,sku_category,format_g,quantity,revenue_uah,margin_uah,cost_calc,counterparty_ms_id&channel_id=neq.internal&order=date.desc&offset=20000&limit=10000'),
      api('sales_channels?select=*&active=eq.true&id=neq.internal&order=sort_order'),
      api('moysklad_sync_log?select=created_at,sync_type,status&order=created_at.desc&limit=1'),
    ]);
    state.rows = [...rows1, ...rows2, ...rows3];
    state.channels = channels;
    state.lastSync = sync[0] || null;
    if (sync[0]) {
      const ago = Math.floor((Date.now() - new Date(sync[0].created_at).getTime())/3600000);
      $('syncLabel').textContent = `Sync ${ago}h тому · ${state.rows.length} записів`;
    }
    populateChannelFilter();
    $('loadingBox').style.display = 'none'; $('contentBox').style.display = 'block';
    render();
  } catch(e){ console.error(e); toast('Помилка: ' + e.message, true); $('syncLabel').textContent = 'Помилка'; }
}
function populateChannelFilter(){
  $('channelFilter').innerHTML = '<option value="">Усі канали</option>' + state.channels.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
}
function getFiltered(){
  const days = state.period === 'all' ? 999999 : Number(state.period);
  const from = new Date(Date.now() - days * 86400000);
  return state.rows.filter(r => {
    if (new Date(r.date) < from) return false;
    if (state.channel && r.channel_id !== state.channel) return false;
    return true;
  });
}
function getPrevious(){
  const days = state.period === 'all' ? 999999 : Number(state.period);
  const from = new Date(Date.now() - 2 * days * 86400000);
  const to = new Date(Date.now() - days * 86400000);
  return state.rows.filter(r => {
    const d = new Date(r.date);
    if (d < from || d >= to) return false;
    if (state.channel && r.channel_id !== state.channel) return false;
    return true;
  });
}
function aggKPI(rows){
  const revenue = rows.reduce((s,r) => s + Number(r.revenue_uah||0), 0);
  const margin = rows.reduce((s,r) => s + Number(r.margin_uah||0), 0);
  const qty = rows.reduce((s,r) => s + Number(r.quantity||0), 0);
  const tx = rows.length;
  const customers = new Set(rows.map(r => r.counterparty_ms_id).filter(Boolean)).size;
  const skus = new Set(rows.map(r => r.sku_id).filter(Boolean)).size;
  return { revenue, margin, qty, tx, customers, skus, aov: tx ? revenue/tx : 0, marginPct: revenue ? margin/revenue*100 : 0 };
}
function render(){
  const tab = state.tab;
  if (tab === 'overview') renderOverview();
  else if (tab === 'dynamics') renderDynamics();
  else if (tab === 'products') renderProducts();
  else if (tab === 'channels') renderChannels();
}
function renderOverview(){
  const rows = getFiltered(), prev = getPrevious();
  const k = aggKPI(rows), p = aggKPI(prev);
  const periodLabel = state.period === 'all' ? 'весь час' : `${state.period} днів`;
  const html = [];
  const revChange = p.revenue ? ((k.revenue - p.revenue)/p.revenue * 100) : null;
  if (revChange != null && revChange < -10) html.push(`<div class="alert red"><span class="icon">📉</span><div class="body"><strong>Виручка падає на ${Math.abs(revChange).toFixed(1)}%</strong><small>vs попередній період того ж розміру</small></div></div>`);
  else if (revChange != null && revChange > 20) html.push(`<div class="alert blue"><span class="icon">🚀</span><div class="body"><strong>Виручка росте на ${revChange.toFixed(1)}%</strong><small>vs попередній період</small></div></div>`);
  html.push(`<div class="sec"><h2>📊 Основні показники</h2><span class="badge">${periodLabel}</span></div>`);
  html.push(`<div class="g1">
    <div class="kpi cy"><div class="lbl">💰 Виручка</div><div class="val">${fmt.uah(k.revenue)}</div><div class="sub">${deltaTag(revChange)} vs попер.</div></div>
    <div class="kpi cg"><div class="lbl">📦 Шт продано</div><div class="val">${fmt.num(k.qty)}</div><div class="sub">${fmt.num(k.tx)} транзакцій</div></div>
    <div class="kpi cb"><div class="lbl">🛒 Сер. чек</div><div class="val">${fmt.uah(k.aov)}</div><div class="sub">грн / транзакція</div></div>
    <div class="kpi"><div class="lbl">👥 Клієнти</div><div class="val">${fmt.num(k.customers)}</div><div class="sub">${deltaTag(p.customers ? ((k.customers - p.customers)/p.customers*100) : null)}</div></div>
    <div class="kpi"><div class="lbl">🏷️ Активних SKU</div><div class="val">${fmt.num(k.skus)}</div><div class="sub">з 24 в каталозі</div></div>
  </div>`);
  const allRows = state.rows.filter(r => !state.channel || r.channel_id === state.channel);
  const totalLifetime = allRows.reduce((s,r) => s + Number(r.revenue_uah||0), 0);
  const runRate = state.period === 'all' ? 0 : k.revenue * 365 / Number(state.period);
  const oneWeek = 7 * 86400000;
  const wkLast = state.rows.filter(r => new Date(r.date) >= new Date(Date.now() - oneWeek) && (!state.channel || r.channel_id === state.channel));
  const wkPrev = state.rows.filter(r => { const d = new Date(r.date); return d >= new Date(Date.now() - 2*oneWeek) && d < new Date(Date.now() - oneWeek) && (!state.channel || r.channel_id === state.channel); });
  const wkLastRev = wkLast.reduce((s,r) => s + Number(r.revenue_uah||0), 0);
  const wkPrevRev = wkPrev.reduce((s,r) => s + Number(r.revenue_uah||0), 0);
  const wowPct = wkPrevRev ? ((wkLastRev - wkPrevRev)/wkPrevRev * 100) : null;
  html.push(`<div class="sec"><h2>❤ Здоров'я бізнесу</h2></div>`);
  html.push(`<div class="g1">
    <div class="kpi dark"><div class="lbl">📈 WoW</div><div class="val">${wowPct != null ? (wowPct > 0 ? '+' : '') + wowPct.toFixed(1) + '%' : '—'}</div><div class="sub">тиждень-до-тижня</div></div>
    <div class="kpi"><div class="lbl">🎯 Маржа</div><div class="val">${fmt.pct(k.marginPct)}</div><div class="sub">${fmt.uah(k.margin)} валової</div></div>
    <div class="kpi"><div class="lbl">⚡ Run-rate (рік)</div><div class="val">${runRate > 0 ? fmt.uahK(runRate) : '—'}</div><div class="sub">за поточним темпом</div></div>
    <div class="kpi"><div class="lbl">💎 Lifetime (весь період)</div><div class="val">${fmt.uahK(totalLifetime)}</div><div class="sub">${state.rows.length} записів</div></div>
    <div class="kpi"><div class="lbl">🔄 Sync</div><div class="val" style="font-size:13px">МойСклад API</div><div class="sub">cron 06:00 UTC щодня</div></div>
  </div>`);
  html.push(`<div class="sec"><h2>📈 Тренд</h2><span class="badge" id="trendBadge"></span></div>`);
  html.push(`<div class="cc" style="margin-bottom:14px">
    <div class="cc-head"><h3>Виручка та маржа</h3><span class="spacer"></span>
      <button class="chip" id="trendDay">📅 День</button>
      <button class="chip" id="trendWeek">📆 Тиждень</button>
      <button class="chip" id="trendMonth">🗓 Місяць</button>
    </div>
    <div class="chart-wrap tall"><canvas id="trendChart"></canvas></div>
  </div>`);
  html.push(`<div class="g2">
    <div class="cc">
      <div class="cc-head"><h3>🏪 Виручка по каналах</h3><span class="pill" id="chanCnt"></span></div>
      <div id="channelBars" class="bars"></div>
    </div>
    <div class="cc">
      <div class="cc-head"><h3>🏆 ТОП SKU</h3><span class="pill" id="skuCnt"></span></div>
      <div class="tbl-scroll"><table class="dt" id="skuTable">
        <thead><tr><th>#</th><th>SKU</th><th>Кат</th><th class="num">Шт</th><th class="num">Виручка</th><th class="num">Маржа%</th></tr></thead>
        <tbody></tbody>
      </table></div>
    </div>
  </div>`);
  $('contentBox').innerHTML = html.join('');
  renderTrendChart('day');
  renderChannelBars();
  renderTopSKU();
  $('trendDay').classList.add('on');
  $('trendDay').addEventListener('click', () => { $$('#trendDay,#trendWeek,#trendMonth').forEach(x=>x.classList.remove('on')); $('trendDay').classList.add('on'); renderTrendChart('day'); });
  $('trendWeek').addEventListener('click', () => { $$('#trendDay,#trendWeek,#trendMonth').forEach(x=>x.classList.remove('on')); $('trendWeek').classList.add('on'); renderTrendChart('week'); });
  $('trendMonth').addEventListener('click', () => { $$('#trendDay,#trendWeek,#trendMonth').forEach(x=>x.classList.remove('on')); $('trendMonth').classList.add('on'); renderTrendChart('month'); });
}
function renderTrendChart(mode){
  const rows = getFiltered();
  const grouped = {};
  rows.forEach(r => {
    let key;
    if (mode === 'day') key = r.date;
    else if (mode === 'week') { const d = new Date(r.date); const ws = new Date(d - ((d.getDay()||7)-1) * 86400000); key = ws.toISOString().slice(0,10); }
    else { key = r.date.slice(0, 7); }
    if (!grouped[key]) grouped[key] = { rev: 0, margin: 0 };
    grouped[key].rev += Number(r.revenue_uah || 0);
    grouped[key].margin += Number(r.margin_uah || 0);
  });
  const keys = Object.keys(grouped).sort();
  const labels = keys.map(k => mode === 'month' ? fmt.month(k) : fmt.date(k));
  if (state.charts.trend) state.charts.trend.destroy();
  state.charts.trend = new Chart($('trendChart'), {
    type: mode === 'day' ? 'line' : 'bar',
    data: { labels, datasets: [
      { label: 'Виручка', data: keys.map(k => grouped[k].rev), backgroundColor: mode === 'day' ? 'rgba(0,17,84,.1)' : 'rgba(0,17,84,.9)', borderColor: '#001154', borderWidth: 2.5, tension: 0.3, fill: mode === 'day', pointRadius: mode === 'day' ? 2 : 0 },
      { label: 'Маржа', data: keys.map(k => grouped[k].margin), type: 'line', borderColor: '#39B44A', backgroundColor: 'transparent', borderWidth: 2, tension: 0.3, pointRadius: 0 },
    ] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { family: 'Rubik', size: 11 } } } }, scales: { y: { ticks: { callback: (v) => fmt.uahK(v) } }, x: { ticks: { maxTicksLimit: 16 } } }, interaction: { intersect: false, mode: 'index' } },
  });
  if ($('trendBadge')) $('trendBadge').textContent = `${keys.length} ${mode === 'day' ? 'днів' : mode === 'week' ? 'тижнів' : 'місяців'}`;
}
function renderChannelBars(){
  const rows = getFiltered(), prev = getPrevious();
  const byCh = {}, byChPrev = {};
  rows.forEach(r => { if (!byCh[r.channel_id]) byCh[r.channel_id] = { name: r.channel_name, color: r.channel_color, rev: 0 }; byCh[r.channel_id].rev += Number(r.revenue_uah||0); });
  prev.forEach(r => { byChPrev[r.channel_id] = (byChPrev[r.channel_id] || 0) + Number(r.revenue_uah||0); });
  const arr = Object.entries(byCh).map(([id, v]) => ({ id, ...v, growth: byChPrev[id] ? ((v.rev - byChPrev[id])/byChPrev[id]*100) : null })).sort((a,b) => b.rev - a.rev);
  if ($('chanCnt')) $('chanCnt').textContent = arr.length;
  const max = Math.max(...arr.map(c => c.rev), 1);
  if ($('channelBars')) $('channelBars').innerHTML = arr.length === 0 ? '<div class="empty">Немає даних</div>' : arr.map(c => {
    const w = (c.rev / max * 100).toFixed(1);
    return `<div class="br"><div class="nm" style="color:${c.color}">${c.name}</div><div class="tk"><div class="fl" style="width:${w}%;background:linear-gradient(90deg,${c.color},${c.color}bb)"></div></div><div class="vl">${fmt.uahK(c.rev)} ${deltaTag(c.growth)}</div></div>`;
  }).join('');
}
function renderTopSKU(){
  const rows = getFiltered();
  const bySku = {};
  rows.forEach(r => { if (!r.sku_id) return; if (!bySku[r.sku_id]) bySku[r.sku_id] = { name: r.sku_name, cat: r.sku_category, qty: 0, rev: 0, margin: 0 }; bySku[r.sku_id].qty += Number(r.quantity||0); bySku[r.sku_id].rev += Number(r.revenue_uah||0); bySku[r.sku_id].margin += Number(r.margin_uah||0); });
  const arr = Object.values(bySku).sort((a,b) => b.rev - a.rev);
  const totalRev = arr.reduce((s,x) => s + x.rev, 0);
  let cum = 0;
  arr.forEach(s => { cum += s.rev; s.cumPct = totalRev ? (cum/totalRev*100) : 0; s.abc = s.cumPct <= 80 ? 'A' : s.cumPct <= 95 ? 'B' : 'C'; s.marginPct = s.rev ? (s.margin/s.rev*100) : 0; });
  if ($('skuCnt')) $('skuCnt').textContent = arr.length;
  if ($('skuTable')) $('skuTable').querySelector('tbody').innerHTML = arr.slice(0, 20).map((s,i) => `<tr><td><span class="abc abc-${s.abc}">${s.abc}</span>${i+1}</td><td title="${s.name}">${(s.name||'').length > 24 ? s.name.slice(0,24)+'…' : s.name}</td><td><small>${s.cat||'—'}</small></td><td class="num">${s.qty}</td><td class="num">${fmt.uah(s.rev)}</td><td class="num">${fmt.pct(s.marginPct)}</td></tr>`).join('');
}
function renderDynamics(){
  const html = [];
  html.push(`<div class="sec"><h2>📈 Heatmap: канал × тиждень (12 тижнів)</h2></div>`);
  html.push(`<div class="cc" style="margin-bottom:14px"><div style="overflow:auto"><table class="heat-tbl" id="heatTable"></table></div></div>`);
  html.push(`<div class="sec"><h2>📊 Місячні підсумки (весь період)</h2></div>`);
  html.push(`<div class="cc"><div class="chart-wrap tall"><canvas id="monthChart"></canvas></div></div>`);
  $('contentBox').innerHTML = html.join('');
  renderHeatmap();
  renderMonthChart();
}
function renderHeatmap(){
  const rows = state.rows.filter(r => !state.channel || r.channel_id === state.channel);
  const weeks = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(Date.now() - i * 7 * 86400000);
    const dow = d.getDay() || 7;
    const monday = new Date(d - (dow - 1) * 86400000);
    weeks.push(monday.toISOString().slice(0, 10));
  }
  const grid = {}, totals = {}, max = {}, channelMeta = {};
  rows.forEach(r => {
    channelMeta[r.channel_id] = { name: r.channel_name, color: r.channel_color };
    const d = new Date(r.date);
    const dow = d.getDay() || 7;
    const monday = new Date(d - (dow - 1) * 86400000).toISOString().slice(0, 10);
    if (!weeks.includes(monday)) return;
    grid[`${r.channel_id}|${monday}`] = (grid[`${r.channel_id}|${monday}`] || 0) + Number(r.revenue_uah||0);
    totals[r.channel_id] = (totals[r.channel_id] || 0) + Number(r.revenue_uah||0);
    max[r.channel_id] = Math.max(max[r.channel_id] || 0, grid[`${r.channel_id}|${monday}`]);
  });
  const sortedChans = Object.keys(totals).sort((a,b) => totals[b] - totals[a]);
  let h = '<thead><tr><th class="lbl">Канал \\ Тиждень</th>';
  weeks.forEach(w => { const d = new Date(w); h += `<th>${('0'+d.getDate()).slice(-2)}.${('0'+(d.getMonth()+1)).slice(-2)}</th>`; });
  h += '<th class="lbl" style="text-align:right;padding-right:10px">Разом</th></tr></thead><tbody>';
  sortedChans.forEach(cid => {
    const meta = channelMeta[cid]; const m = max[cid] || 1;
    h += `<tr><td class="lbl" style="border-left-color:${meta.color}">${meta.name}</td>`;
    weeks.forEach(w => {
      const v = grid[`${cid}|${w}`] || 0;
      if (v === 0) h += `<td class="empty">·</td>`;
      else {
        const intensity = Math.min(0.95, 0.25 + (v/m) * 0.7);
        const rgb = meta.color.startsWith('#') ? hexToRgba(meta.color, intensity) : meta.color;
        h += `<td title="${meta.name} · ${w}: ${fmt.uah(v)}" style="background:${rgb}">${fmt.uahK(v)}</td>`;
      }
    });
    h += `<td class="tot">${fmt.uahK(totals[cid])}</td></tr>`;
  });
  h += '</tbody>';
  $('heatTable').innerHTML = h;
}
function renderMonthChart(){
  const rows = state.rows.filter(r => !state.channel || r.channel_id === state.channel);
  const byMonth = {};
  rows.forEach(r => { const k = r.date.slice(0, 7); byMonth[k] = (byMonth[k] || 0) + Number(r.revenue_uah||0); });
  const keys = Object.keys(byMonth).sort();
  if (state.charts.month) state.charts.month.destroy();
  state.charts.month = new Chart($('monthChart'), {
    type: 'bar',
    data: { labels: keys.map(k => fmt.month(k)), datasets: [{ label: 'Виручка ₴', data: keys.map(k => byMonth[k]), backgroundColor: '#001154', borderRadius: 4 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { ticks: { callback: (v) => fmt.uahK(v) } } } },
  });
}

  const totalRev = arr.reduce((s,x) => s + x.rev, 0); let cum = 0;
  arr.forEach(s => { cum += s.rev; s.cumPct = totalRev ? (cum/totalRev*100) : 0; s.abc = s.cumPct <= 80 ? 'A' : s.cumPct <= 95 ? 'B' : 'C'; s.marginPct = s.rev ? (s.margin/s.rev*100) : 0; s.share = totalRev ? (s.rev/totalRev*100) : 0; });

    <div class="cc"><div class="tbl-scroll" style="max-height:none"><table class="dt">
      <thead><tr><th>ABC</th><th>#</th><th>SKU</th><th>Кат</th><th class="num">Шт</th><th class="num">Виручка</th><th class="num">Маржа</th><th class="num">Маржа%</th><th class="num">Частка</th><th class="num">Клієнтів</th><th class="num">Δ%</th></tr></thead>
      <tbody>${arr.map((s,i) => `<tr><td><span class="abc abc-${s.abc}">${s.abc}</span></td><td>${i+1}</td><td>${s.name}</td><td><small>${s.cat||'—'}</small></td><td class="num">${s.qty}</td><td class="num">${fmt.uah(s.rev)}</td><td class="num">${fmt.uah(s.margin)}</td><td class="num">${fmt.pct(s.marginPct)}</td><td class="num">${fmt.pct(s.share)}</td><td class="num">${s.custCount}</td><td class="num">${deltaTag(s.growth)}</td></tr>`).join('')}</tbody>
    </table></div></div>
    <div class="sec"><h2>📊 ABC аналіз (Pareto)</h2></div>
    <div class="cc"><div class="chart-wrap tall"><canvas id="abcChart"></canvas></div></div>
  `;
  if (state.charts.abc) state.charts.abc.destroy();
  state.charts.abc = new Chart($('abcChart'), {
    type: 'bar',
    data: { labels: arr.map(s => (s.name||'').length > 16 ? s.name.slice(0,16)+'…' : s.name),
      datasets: [
        { label: 'Виручка', type: 'bar', data: arr.map(s => s.rev), backgroundColor: arr.map(s => s.abc === 'A' ? '#39B44A' : s.abc === 'B' ? '#F59E0B' : '#94a3b8'), yAxisID: 'y' },
        { label: 'Кумулятивний %', type: 'line', data: arr.map(s => s.cumPct), borderColor: '#001154', backgroundColor: 'transparent', borderWidth: 2.5, pointRadius: 3, tension: 0.2, yAxisID: 'y1' },
      ],
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } }, scales: { y: { position: 'left', ticks: { callback: (v) => fmt.uahK(v) } }, y1: { position: 'right', max: 100, min: 0, ticks: { callback: (v) => v + '%' }, grid: { drawOnChartArea: false } } } },
  });
}
function renderChannels(){
  const rows = getFiltered(), prev = getPrevious();
  const byCh = {}, byChPrev = {};
  rows.forEach(r => { if (!byCh[r.channel_id]) byCh[r.channel_id] = { name: r.channel_name, color: r.channel_color, rev: 0, margin: 0, qty: 0, tx: 0, cust: new Set() }; byCh[r.channel_id].rev += Number(r.revenue_uah||0); byCh[r.channel_id].margin += Number(r.margin_uah||0); byCh[r.channel_id].qty += Number(r.quantity||0); byCh[r.channel_id].tx++; if (r.counterparty_ms_id) byCh[r.channel_id].cust.add(r.counterparty_ms_id); });

    <div class="cc"><div class="tbl-scroll" style="max-height:none"><table class="dt">

function hexToRgba(hex, alpha){ const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16); return `rgba(${r},${g},${b},${alpha})`; }
