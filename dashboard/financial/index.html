<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Financial · Barpi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/bb.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--y:#001154;--y-soft:rgba(0,17,84,.13);--g:#39B44A;--g-soft:rgba(57,180,74,.13);--r:#E84040;--r-soft:rgba(232,64,64,.1);--bl:#3B82F6;--or:#F59E0B;--vi:#8B5CF6;--d:#1A1A1A;--bg:#FAF7F7;--card:#fff;--muted:#888;--border:#E5E5DC;--line:#EEE}
body{background:var(--bg);font-family:Rubik,-apple-system,sans-serif;color:var(--d);margin:0}
.fn-top{position:sticky;top:0;z-index:200;background:var(--d);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px;border-bottom:3px solid var(--y)}
.fn-top h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
.fn-top .sub{font-size:11px;opacity:.6;font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.fn-top .spacer{flex:1}
.fn-top .sync{font-size:12px;opacity:.7;display:flex;align-items:center;gap:6px}
.fn-top .dot{width:8px;height:8px;border-radius:50%;background:var(--g)}
.fn-wrap{max-width:1440px;margin:0 auto;padding:20px 24px 40px}
.sec{margin:24px 0 12px;display:flex;align-items:center;gap:10px}
.sec h2{margin:0;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sec .badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--y-soft);color:var(--y)}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.g2,.g3,.g4,.g5{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi .lbl{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.kpi .val{font-size:22px;font-weight:800;color:var(--d);letter-spacing:-.02em;line-height:1.1}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:6px}
.kpi.cy{border-bottom:3px solid var(--y)}.kpi.cg{border-bottom:3px solid var(--g)}.kpi.cr{border-bottom:3px solid var(--r)}.kpi.cb{border-bottom:3px solid var(--bl)}.kpi.co{border-bottom:3px solid var(--or)}.kpi.cv{border-bottom:3px solid var(--vi)}
.kpi.neg .val{color:var(--r)}
.kpi.pos .val{color:var(--g)}
.cc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.cc-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cc-head h3{margin:0;font-size:14px;font-weight:700;color:var(--d)}
.cc-head .pill{font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--y-soft);color:var(--y);text-transform:uppercase}
.chart-wrap{position:relative;height:280px}
.chart-wrap.tall{height:360px}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt th{text-align:left;padding:8px 12px;font-weight:700;font-size:10px;text-transform:uppercase;color:var(--muted);background:#FAFAF5;border-bottom:1px solid var(--line);letter-spacing:.05em}
table.dt td{padding:9px 12px;border-bottom:1px solid #F4F4F0;color:var(--d)}
table.dt td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.tbl-scroll{max-height:480px;overflow:auto;border-radius:8px;border:1px solid var(--line)}
.pnl-row{display:grid;grid-template-columns:1fr 130px 130px 130px 130px 130px 100px 130px;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-size:12px}
.pnl-row.head{font-weight:700;color:var(--muted);font-size:10px;text-transform:uppercase;background:#FAFAF5;border-radius:8px}
.pnl-row .lbl{font-weight:700}
.pnl-row .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.pnl-row .num.neg{color:var(--r)}
.pnl-row .num.pos{color:var(--g)}
.pnl-row .num.neut{color:var(--d)}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px}
.tag.tg{background:var(--g-soft);color:var(--g)}.tag.tr{background:var(--r-soft);color:var(--r)}
.loading{text-align:center;padding:60px;color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header class="fn-top">
  <h1>💵 Barpi · <span class="sub">Financial v3 — Real P&L</span></h1>
  <span class="spacer"></span>
  <span class="sync"><span class="dot"></span><span id="syncLabel">Завантаження…</span></span>
</header>
<div class="fn-wrap">
  <div id="loadingBox" class="loading"><div>Завантаження…</div></div>
  <div id="contentBox" style="display:none"></div>
</div>
<script src="../../assets/bb.js"></script>
<script>
const SUPA_URL='https://barpi-api.vg-ab6.workers.dev';
const SUPA_KEY='';
const $=(id)=>document.getElementById(id);
const fmt={uah:(n)=>new Intl.NumberFormat('uk-UA').format(Math.round(n||0))+' ₴',uahK:(n)=>n>=1e6?(n/1e6).toFixed(1)+'M ₴':n>=1e3?(n/1e3).toFixed(0)+'K ₴':Math.round(n||0)+' ₴',num:(n)=>new Intl.NumberFormat('uk-UA').format(n||0),date:(s)=>{if(!s)return '—';const d=new Date(s);return d.toLocaleDateString('uk-UA',{day:'2-digit',month:'2-digit',year:'2-digit'});},month:(s)=>{const d=new Date(s);return d.toLocaleDateString('uk-UA',{month:'short',year:'2-digit'});}};
function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function truncate(s,n){return (s||'').length>n?s.slice(0,n)+'…':s;}
async function api(p){const r=await fetch(SUPA_URL+'/'+p,{headers:{'Content-Type':'application/json'}});if(!r.ok){if(r.status===404)return [];throw new Error('API '+r.status);}return r.json();}
let charts={};
async function load(){
  try{
    const [pnl,cf,expByItem,supBySup,supByProd,porders,sync]=await Promise.all([
      api('v_pnl_monthly?select=*&order=month'),
      api('v_cash_flow?select=*&order=month'),
      api('v_expenses_by_item?select=*&order=month.desc&limit=200'),
      api('v_supplies_by_supplier?select=*&order=month.desc&limit=100'),
      api('v_supplies_by_product?select=*&order=total_sum_uah.desc&limit=20'),
      api('v_purchase_orders_pipeline?select=*&order=month'),
      api('sync_state?entity=eq.demand&select=last_synced_at&limit=1'),
    ]);
    $('loadingBox').style.display='none';$('contentBox').style.display='block';
    if(sync[0]&&sync[0].last_synced_at){const h=Math.floor((Date.now()-new Date(sync[0].last_synced_at).getTime())/3600000);$('syncLabel').textContent=`Sync ${h}h тому · ${pnl.length} міс · D1`;}else{$('syncLabel').textContent=`${pnl.length} міс · D1 live`;}
    render({pnl,cf,expByItem,supBySup,supByProd,porders});
  }catch(e){console.error(e);$('syncLabel').textContent='Помилка: '+e.message;}
}
function render(d){
  const {pnl,cf,expByItem,supBySup,supByProd,porders}=d;
  const totalRev=pnl.reduce((s,m)=>s+Number(m.revenue_uah||m.revenue||0),0);
  const totalSupplies=pnl.reduce((s,m)=>s+Number(m.supplies_uah||m.cogs||0),0);
  const totalOpex=pnl.reduce((s,m)=>s+Number(m.opex_uah||m.opex||0),0);
  const totalLosses=pnl.reduce((s,m)=>s+Number(m.losses_uah||0),0);
  const totalCollected=pnl.reduce((s,m)=>s+Number(m.collected_uah||0),0);
  const totalNet=pnl.reduce((s,m)=>s+Number(m.net_profit_uah||m.net_profit||0),0);
  const totalMarginPct=totalRev>0?((totalRev-totalSupplies-totalOpex)/totalRev*100):0;
  const expAgg={};
  expByItem.forEach(e=>{const k=e.expense_item||'— без статті —';if(!expAgg[k])expAgg[k]={sum:0,cnt:0};expAgg[k].sum+=Number(e.sum_uah||0);expAgg[k].cnt+=e.payments_count;});
  const expRows=Object.entries(expAgg).map(([k,v])=>({item:k,sum:v.sum,cnt:v.cnt})).sort((a,b)=>b.sum-a.sum);
  const supAgg={};
  supBySup.forEach(s=>{const k=s.supplier_name||'— невідомий —';if(!supAgg[k])supAgg[k]={sum:0,paid:0,cnt:0};supAgg[k].sum+=Number(s.sum_uah||0);supAgg[k].paid+=Number(s.paid_uah||0);supAgg[k].cnt+=s.supplies_count;});
  const supRows=Object.entries(supAgg).map(([k,v])=>({sup:k,sum:v.sum,paid:v.paid,cnt:v.cnt,debt:v.sum-v.paid})).sort((a,b)=>b.sum-a.sum);

  $('contentBox').innerHTML=`
    <div class="sec"><h2>💵 Lifetime P&L (з 06.01.2025)</h2></div>
    <div class="g5">
      <div class="kpi cg"><div class="lbl">💰 Виручка lifetime</div><div class="val">${fmt.uahK(totalRev)}</div><div class="sub">demand з МС</div></div>
      <div class="kpi cb"><div class="lbl">📦 Закупки сировини</div><div class="val">${fmt.uahK(totalSupplies)}</div><div class="sub">supplies</div></div>
      <div class="kpi co"><div class="lbl">💸 OpEx (виплати)</div><div class="val">${fmt.uahK(totalOpex)}</div><div class="sub">paymentout</div></div>
      <div class="kpi cr"><div class="lbl">⚠ Списання</div><div class="val">${fmt.uahK(totalLosses)}</div><div class="sub">loss</div></div>
      <div class="kpi ${totalNet>=0?'cg pos':'cr neg'}"><div class="lbl">📊 Net Profit (raw)</div><div class="val">${fmt.uahK(totalNet)}</div><div class="sub">${totalMarginPct.toFixed(1)}% маржа</div></div>
    </div>

    <div class="sec"><h2>🧾 Cash Flow (отримано vs виплачено)</h2></div>
    <div class="g3">
      <div class="kpi cg"><div class="lbl">💵 Отримано грошей</div><div class="val">${fmt.uahK(totalCollected)}</div><div class="sub">paymentin</div></div>
      <div class="kpi co"><div class="lbl">💸 Виплачено</div><div class="val">${fmt.uahK(totalOpex)}</div><div class="sub">paymentout</div></div>
      <div class="kpi ${totalCollected-totalOpex>=0?'cg pos':'cr neg'}"><div class="lbl">📊 Net Cash Flow</div><div class="val">${fmt.uahK(totalCollected-totalOpex)}</div><div class="sub">on hand</div></div>
    </div>

    <div class="sec"><h2>📈 P&L по місяцях (stacked bar + Net Profit line)</h2></div>
    <div class="cc"><div class="chart-wrap tall"><canvas id="pnlChart"></canvas></div></div>

    <div class="sec"><h2>💰 Cash Flow по місяцях</h2></div>
    <div class="cc"><div class="chart-wrap"><canvas id="cfChart"></canvas></div></div>

    <div class="sec"><h2>📋 Детальний P&L (останні 12 міс)</h2></div>
    <div class="cc">
      <div class="pnl-row head"><div class="lbl">Місяць</div><div class="num">Виручка</div><div class="num">Сировина</div><div class="num">OpEx</div><div class="num">Списання</div><div class="num">Net Profit</div><div class="num">Маржа</div><div class="num">Отримано</div></div>
      ${pnl.slice(-12).reverse().map(m=>{
        const rev=Number(m.revenue_uah||m.revenue||0);
        const sup=Number(m.supplies_uah||m.cogs||0);
        const opex=Number(m.opex_uah||m.opex||0);
        const loss=Number(m.losses_uah||0);
        const np=Number(m.net_profit_uah||m.net_profit||(rev-sup-opex-loss));
        const margin=rev>0?(((rev-sup-opex)/rev)*100).toFixed(1):0;
        return `<div class="pnl-row"><div class="lbl">${fmt.month(m.month)}</div><div class="num neut">${fmt.uahK(rev)}</div><div class="num neg">${fmt.uahK(sup)}</div><div class="num neg">${fmt.uahK(opex)}</div><div class="num neg">${fmt.uahK(loss)}</div><div class="num ${np>=0?'pos':'neg'}">${fmt.uahK(np)}</div><div class="num ${Number(margin)>=0?'pos':'neg'}">${margin}%</div><div class="num neut">${fmt.uahK(m.collected_uah)}</div></div>`;
      }).join('')}
    </div>

    <div class="g2" style="margin-top:14px">
      <div class="cc">
        <div class="cc-head"><h3>💸 Витрати по статтях (lifetime)</h3><span class="pill">${expRows.length}</span></div>
        <div class="tbl-scroll"><table class="dt">
          <thead><tr><th>#</th><th>Стаття</th><th class="num">Платежів</th><th class="num">Сума ₴</th><th class="num">% від OpEx</th></tr></thead>
          <tbody>${expRows.map((r,i)=>`<tr><td>${i+1}</td><td><strong>${escapeHtml(r.item)}</strong></td><td class="num">${r.cnt}</td><td class="num">${fmt.uahK(r.sum)}</td><td class="num">${totalOpex>0?(r.sum/totalOpex*100).toFixed(1):0}%</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Немає даних — view v_expenses_by_item ще не створено у D1</td></tr>'}</tbody>
        </table></div>
      </div>
      <div class="cc">
        <div class="cc-head"><h3>🏭 Постачальники (lifetime)</h3><span class="pill">${supRows.length}</span></div>
        <div class="tbl-scroll"><table class="dt">
          <thead><tr><th>#</th><th>Постачальник</th><th class="num">#</th><th class="num">Сума</th><th class="num">Опл.</th><th class="num">Борг</th></tr></thead>
          <tbody>${supRows.map((r,i)=>`<tr><td>${i+1}</td><td><strong>${escapeHtml(truncate(r.sup,24))}</strong></td><td class="num">${r.cnt}</td><td class="num">${fmt.uahK(r.sum)}</td><td class="num">${fmt.uahK(r.paid)}</td><td class="num"><span class="tag ${r.debt>0?'tr':'tg'}">${fmt.uahK(r.debt)}</span></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Немає даних — view v_supplies_by_supplier ще не створено у D1</td></tr>'}</tbody>
        </table></div>
      </div>
    </div>

    <div class="sec"><h2>📦 ТОП-20 закупленої сировини</h2></div>
    <div class="cc"><div class="tbl-scroll"><table class="dt">
      <thead><tr><th>#</th><th>SKU</th><th class="num">Разів</th><th class="num">Кількість</th><th class="num">Сума ₴</th><th class="num">₴/од.</th></tr></thead>
      <tbody>${supByProd.map((s,i)=>`<tr><td>${i+1}</td><td title="${escapeHtml(s.product_name||'')}">${escapeHtml(truncate(s.product_name||'—',40))}</td><td class="num">${s.times_bought}</td><td class="num">${Number(s.total_qty).toFixed(0)}</td><td class="num">${fmt.uahK(s.total_sum_uah)}</td><td class="num">${fmt.uah(s.avg_cost_per_unit)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Немає даних — view v_supplies_by_product ще не створено у D1</td></tr>'}</tbody>
    </table></div></div>

    <div class="sec"><h2>📥 Purchase Orders pipeline (замовлено / отримано / оплачено)</h2></div>
    <div class="cc"><div class="chart-wrap"><canvas id="poChart"></canvas></div></div>
  `;
  setTimeout(()=>{
    if(charts.pnl)charts.pnl.destroy();
    charts.pnl=new Chart($('pnlChart'),{
      type:'bar',
      data:{labels:pnl.map(m=>fmt.month(m.month)),datasets:[
        {label:'Виручка',data:pnl.map(m=>Number(m.revenue_uah||m.revenue||0)),backgroundColor:'#39B44A',stack:'a',borderRadius:2},
        {label:'Сировина',data:pnl.map(m=>-Number(m.supplies_uah||m.cogs||0)),backgroundColor:'#3B82F6',stack:'a',borderRadius:2},
        {label:'OpEx',data:pnl.map(m=>-Number(m.opex_uah||m.opex||0)),backgroundColor:'#F59E0B',stack:'a',borderRadius:2},
        {label:'Списання',data:pnl.map(m=>-Number(m.losses_uah||0)),backgroundColor:'#E84040',stack:'a',borderRadius:2},
        {label:'Net Profit',data:pnl.map(m=>Number(m.net_profit_uah||m.net_profit||0)),type:'line',borderColor:'#001154',backgroundColor:'transparent',borderWidth:3,tension:.3,pointRadius:4,pointBackgroundColor:'#001154'},
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:(ctx)=>ctx.dataset.label+': '+fmt.uah(Math.abs(ctx.parsed.y))}}},scales:{y:{ticks:{callback:(v)=>fmt.uahK(v)}}}}
    });
    if(charts.cf)charts.cf.destroy();
    charts.cf=new Chart($('cfChart'),{
      type:'bar',
      data:{labels:cf.map(m=>fmt.month(m.month)),datasets:[
        {label:'Cash In',data:cf.map(m=>Number(m.cash_in||0)),backgroundColor:'#39B44A',borderRadius:4},
        {label:'Cash Out',data:cf.map(m=>-Number(m.cash_out||0)),backgroundColor:'#E84040',borderRadius:4},
        {label:'Net Cash',data:cf.map(m=>Number(m.net_cash||0)),type:'line',borderColor:'#001154',borderWidth:2,tension:.3,pointRadius:3},
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{y:{ticks:{callback:(v)=>fmt.uahK(v)}}}}
    });
    if(charts.po)charts.po.destroy();
    charts.po=new Chart($('poChart'),{
      type:'bar',
      data:{labels:porders.map(m=>fmt.month(m.month)),datasets:[
        {label:'Замовлено',data:porders.map(m=>Number(m.total_uah||0)),backgroundColor:'#001154',borderRadius:4},
        {label:'Отримано',data:porders.map(m=>Number(m.received_uah||0)),backgroundColor:'#39B44A',borderRadius:4},
        {label:'Оплачено',data:porders.map(m=>Number(m.paid_uah||0)),backgroundColor:'#3B82F6',borderRadius:4},
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{y:{ticks:{callback:(v)=>fmt.uahK(v)}}}}
    });
  },50);
}
load();
</script>
</body>
</html>
