name = "barpi-deck"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = false

# Презентація живе в приватному R2, а не в публічному репозиторії GitHub Pages.
[[r2_buckets]]
binding = "DECK"
bucket_name = "barpi-deck"

# Той самий KV, що й у barpi-auth — тут лише для throttle невдалих спроб.
[[kv_namespaces]]
binding = "OTP_KV"
id = "5d2685f414a14ff4ac050eea5b19bdcf"

[[routes]]
pattern = "brand.barpi.ua/deck*"
zone_name = "barpi.ua"

# Секрети (npx wrangler secret put ...):
#   DECK_PASSWORD   — пароль, який отримує інвестор
#   SESSION_SECRET  — випадковий hex 64, підписує cookie сесії
